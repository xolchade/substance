*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink)}
body{font:16px/1.5 var(--fb);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
html{scrollbar-color:#B9BFD3 transparent;accent-color:var(--blue);caret-color:var(--blue)}
::selection{background:var(--lime);color:var(--ink)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
.hidden{display:none!important}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.logo{display:inline-block;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;aspect-ratio:732/392}
.dots{background-color:var(--blue);background-image:radial-gradient(rgba(255,255,255,.26) 1.3px,transparent 1.8px);background-size:30px 30px;background-position:15px 15px}

/* ---------- вход ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:32px 16px;gap:28px;align-content:center;color:#fff}
.login>.logo{width:180px;color:#fff}
.lbox{width:min(420px,100%);border-radius:28px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;background:#fff;color:var(--ink);box-shadow:0 18px 40px rgba(0,0,0,.22)}
.lbox h1{font:700 22px/1.15 var(--fh);text-transform:uppercase;letter-spacing:-.01em;color:var(--blue)}
.lbox p{font-size:15px;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
.fld input{height:48px;border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:0 14px;font-size:16px;font-weight:400;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
.fld input:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--tint-h)}
.btn{height:48px;border:0;border-radius:999px;background:var(--blue);color:#fff;font-weight:700;font-size:16px;transition:background-color .15s}
.btn:hover{background:var(--blue-h)}
.btn:disabled{opacity:.6;cursor:progress}
.gbtn{height:44px;border:1.5px solid var(--blue);border-radius:999px;background:#fff;color:var(--blue);font-weight:600;font-size:15px;transition:background-color .15s}
.gbtn:hover{background:var(--tint)}
.lbox.guest .fu{display:none}
.lerr{min-height:20px;font-size:14px;font-weight:600;color:#B3261E}

/* ---------- верхняя панель ---------- */
.bar{position:sticky;top:0;z-index:15;background:var(--blue);color:#fff;border-bottom:1px solid rgba(255,255,255,.14)}
.bar-in{max-width:1280px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;white-space:nowrap;color:#fff;text-decoration:none}
.brand .logo{width:66px}
.brand>span:not(.logo){font-size:14px;font-weight:600;opacity:.85}
.tabs{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:3px}
.tabs::-webkit-scrollbar{display:none}
.tab{height:38px;padding:0 16px;border:1.5px solid rgba(255,255,255,.35);border-radius:999px;background:none;color:#fff;font-weight:600;font-size:15px;white-space:nowrap;transition:background-color .15s,color .15s,border-color .15s}
.tab:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.6)}
.tab[aria-selected="true"]{background:#fff;color:var(--blue);border-color:#fff}
.tools{display:flex;align-items:center;gap:8px;flex:none}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:rgba(255,255,255,.88);max-width:400px;line-height:1.25}
.sync i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.5);flex:none}
.sync.ok i{background:var(--lime)}.sync.busy i{background:#FFC24B}.sync.bad{color:#FFD2C4}.sync.bad i{background:var(--orange)}
.tb{height:36px;border:1.5px solid rgba(255,255,255,.45);border-radius:999px;background:none;color:#fff;padding:0 14px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background-color .15s}
.tb:hover{background:rgba(255,255,255,.14)}
.tb b{font-variant-numeric:tabular-nums}
body.ro #chg,body.ro .pen{display:none!important}

/* ---------- шапка раздела ---------- */
.hero{color:#fff}
.hero-in{max-width:1280px;margin:0 auto;padding:44px 24px 48px;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,380px);gap:28px 48px;align-items:start}
.hero h1{font:700 clamp(22px,min(6.2vw,3.4vw + 8px),44px)/1.05 var(--fh);overflow-wrap:anywhere;text-transform:uppercase;letter-spacing:-.01em;text-wrap:balance}
.hero .intro{margin-top:18px;font-size:17px;line-height:1.55;color:rgba(255,255,255,.88);max-width:68ch}
.who{background:#fff;color:var(--ink);border-radius:28px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.who .r{display:block;color:var(--muted2);font-size:13px;line-height:1.35}
.who .nm{display:block;font-weight:700;font-size:16px;line-height:1.3}
.who .ps{display:block;color:var(--muted2);font-size:13px}
.kp{display:flex;flex-wrap:wrap;gap:14px 34px;margin-top:30px}
.kp b{display:block;font:700 34px/1 var(--fh);color:#fff;font-variant-numeric:tabular-nums}
.kp span{display:block;margin-top:6px;font-size:14px;color:rgba(255,255,255,.82);max-width:16ch;line-height:1.3}
.staff{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;margin-top:-2px;padding:10px 14px;border-radius:16px;background:var(--tint)}
.staff .sl{flex:1 0 100%;font-size:13px;color:var(--muted2)}
.staff div{display:flex;align-items:baseline;gap:6px}
.staff div span{font-size:13px;color:var(--muted)}
.staff b{font:700 18px/1.1 var(--fh);color:var(--blue);font-variant-numeric:tabular-nums}
.tot{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:4px;padding-top:14px;border-top:1px solid var(--line)}
.tot b{font:700 20px/1.1 var(--fh);color:var(--blue);text-align:right;font-variant-numeric:tabular-nums}
.tot span{color:var(--muted);align-self:center;font-size:14px}
.legend{max-width:1280px;margin:0 auto;padding:22px 24px 0;display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px;color:var(--muted)}
.legend div{display:flex;align-items:center;gap:9px}
.legend i{width:30px;height:16px;border-radius:999px;flex:none}
.legend i.m{background:var(--blue)}.legend i.s{background:var(--tint);box-shadow:inset 0 0 0 1.5px var(--tint-h)}.legend i.x{background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--line)}

/* ---------- карта ---------- */
.map{position:relative;max-width:1280px;margin:0 auto;padding:28px 24px 96px}
svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 270px minmax(0,1fr);column-gap:72px;align-items:center;padding:28px 0}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.col.l{align-items:flex-end}.col.r{align-items:flex-start}
.n{position:relative;font:500 15px/1.3 var(--fb);text-align:center;border:0;border-radius:22px;padding:11px 18px;background:var(--tint);color:var(--ink);width:min(100%,340px);transition:background-color .15s,box-shadow .15s}
.n:hover{background:var(--tint-h)}
.n.main{background:var(--blue);color:#fff;font-weight:700;font-size:16px;padding:15px 20px;width:100%;z-index:1;border-radius:999px}
.n.main:hover{background:var(--blue-h)}
.n.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--focus)}
.n .tm{display:block;font-size:12.5px;font-weight:600;color:var(--muted2);margin-bottom:2px;font-variant-numeric:tabular-nums}
.n.life{background:var(--soft);color:var(--muted)}.n.life:hover{background:var(--soft-h)}
.steps{display:flex;flex-direction:column;gap:8px;padding-left:28px;width:min(100%,340px)}
.n.st{background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);text-align:left;padding:8px 14px 8px 44px;font-size:14.5px;width:100%;border-radius:18px}
.n.st:hover{background:var(--tint)}
.n.st b{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font:700 12px/26px var(--fb);text-align:center;font-variant-numeric:tabular-nums}
.n.st.on{box-shadow:inset 0 0 0 1.5px var(--line),0 0 0 3px #fff,0 0 0 6px var(--focus)}
.n.ex{background:var(--soft)}.n.ex:hover{background:var(--soft-h)}
.n.d-op{background:var(--orange);color:var(--navy)}.n.d-op:hover{background:#DD5129}
.n.d-oo{background:var(--lilac)}.n.d-oo:hover{background:#5636B5}
.n.d-otis{background:var(--green);color:var(--navy)}.n.d-otis:hover{background:#38A982}
.n.addn{background:#fff;box-shadow:inset 0 0 0 1.5px var(--blue);color:var(--blue);font-weight:600;font-size:14px;padding:8px 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;border:0;opacity:.75}
.n.addn:hover{opacity:1;background:var(--tint)}
.n.addn .ic{width:15px;height:15px}
.n.addn.mob{display:none}

/* ---------- панель справа ---------- */
.scrim{position:fixed;inset:0;background:rgba(13,19,29,.38);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.pn{position:fixed;top:0;right:0;bottom:0;width:min(600px,100vw);background:#fff;z-index:21;transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;visibility:hidden;box-shadow:-24px 0 60px rgba(13,19,29,.18);border-radius:28px 0 0 28px}
body.open .pn{transform:none;visibility:visible}body.open .scrim{opacity:1;pointer-events:auto}
.ph{display:flex;align-items:center;gap:8px;padding:16px 20px 14px 28px;border-bottom:1px solid var(--line)}
.ph .crumb{flex:1;min-width:0;font-size:14px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .crumb::before{content:'['}.ph .crumb::after{content:']'}
.ib{width:40px;height:40px;border:1.5px solid var(--line);border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;color:var(--ink);transition:background-color .15s,border-color .15s}
.ib:hover{background:var(--tint);border-color:var(--tint-h)}
.pb{flex:1;overflow:auto;padding:24px 28px 44px}

/* ---------- шифрование (ключ и пользователи — как в календаре стратсессии) ---------- */
const enc=new TextEncoder(),dec=new TextDecoder();

async function login(u,p){

      const body={message:'volume: правки',content:b64(enc.encode(JSON.stringify(await encJSON(next))))};if(sha)body.sha=sha;
      const r=await fetch(api(),{method:'PUT',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(r.status===409||r.status===422){await new Promise(z=>setTimeout(z,600*(i+1)));continue}
      if(!r.ok)throw new Error(r.status===401?'токен GitHub недействителен или истёк':'GitHub '+r.status);
      PEND=PEND.slice(sent);DOC=PEND.length?rebase(next):next;await saveLocal();clearTimeout(retryT);retryN=0;syncSt('Сохранено на сервере','ok');if(!editing&&RENDERED)refresh();return;
    }catch(e){
      const why=e.name==='TypeError'?'нет связи с GitHub':e.message;
      if(retryN<5){retryN++;clearTimeout(retryT);retryT=setTimeout(()=>persist(),15000*retryN);syncSt(`Не сохранено: ${why}. Повторю автоматически`,'bad')}
      else syncSt(`Не сохранено: ${why}. Правки остались в этом браузере`,'bad');
      $('#sync').title='Правки хранятся в этом браузере и уйдут на сервер при следующей удачной попытке';return}
  }
  clearTimeout(retryT);retryT=setTimeout(()=>persist(),5000);syncSt('Конфликт при сохранении, повторяю…','busy');
}
let retryT=0,retryN=0;
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&KEY&&!editing)syncPull()});
</script>
