<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Объём работы лидерской программы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Дизайн-система: Minimalism & Swiss + Data-Dense Dashboard (ui-ux-pro-max), шрифты Fira Sans / Fira Code */
:root{
  --bg:#f8fafc;--card:#fff;--fg:#0f172a;--muted:#475569;--muted2:#64748b;--line:#e2e8f0;--line2:#cbd5e1;--soft:#f1f5f9;
  --primary:#1e3a5f;--secondary:#2563eb;--on-sec:#fff;--accent:#16a34a;--danger:#dc2626;--warn:#b45309;--warn-bg:#fef3c7;
  --c1:#2563eb;--c2:#0f766e;--c3:#7c3aed;--c4:#b45309;--c5:#475569;
  --sh1:0 1px 2px rgba(15,23,42,.05);--sh2:0 8px 24px rgba(15,23,42,.08);
  --f:'Fira Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--m:'Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sb:268px;--on-node:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1120;--card:#111827;--fg:#e5e7eb;--muted:#a3adbd;--muted2:#8b95a7;--line:#1f2937;--line2:#334155;--soft:#172033;
  --primary:#93c5fd;--secondary:#60a5fa;--on-sec:#0b1120;--accent:#22c55e;--danger:#f87171;--warn:#fbbf24;--warn-bg:rgba(251,191,36,.12);
  --c1:#60a5fa;--c2:#2dd4bf;--c3:#a78bfa;--c4:#fbbf24;--c5:#94a3b8;--sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 10px 30px rgba(0,0,0,.5);--on-node:#0b1120;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1120;--card:#111827;--fg:#e5e7eb;--muted:#a3adbd;--muted2:#8b95a7;--line:#1f2937;--line2:#334155;--soft:#172033;
  --primary:#93c5fd;--secondary:#60a5fa;--on-sec:#0b1120;--accent:#22c55e;--danger:#f87171;--warn:#fbbf24;--warn-bg:rgba(251,191,36,.12);
  --c1:#60a5fa;--c2:#2dd4bf;--c3:#a78bfa;--c4:#fbbf24;--c5:#94a3b8;--sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 10px 30px rgba(0,0,0,.5);--on-node:#0b1120;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
::selection{background:color-mix(in srgb,var(--secondary) 24%,transparent)}
html{scrollbar-color:var(--line2) transparent;accent-color:var(--secondary);caret-color:var(--secondary)}
body{margin:0;font:15px/1.5 var(--f);background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--secondary);outline-offset:2px;border-radius:6px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- сайдбар ---------- */
.sb{position:fixed;inset:0 auto 0 0;width:var(--sb);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30;transition:transform .25s ease}
.brand{display:flex;gap:12px;align-items:center;padding:20px 20px 18px;border-bottom:1px solid var(--line)}
.logo{width:40px;height:40px;border-radius:12px;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none}
:root[data-theme="dark"] .logo{color:#0b1120}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{color:#0b1120}}
.brand small{display:block;font-size:12px;font-weight:600;color:var(--muted2);letter-spacing:.02em}
.brand .dept{display:block;font-size:15px;font-weight:700;line-height:1.25}
.nav{padding:14px 12px;overflow:auto;flex:1}
.nav .nh{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);padding:6px 10px 8px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px;transition:background-color .2s,color .2s}
.nav a:hover{background:var(--soft);color:var(--fg)}
.nav a.on{background:color-mix(in srgb,var(--pc) 12%,transparent);color:var(--fg);font-weight:600}
.nav a i{width:8px;height:8px;border-radius:50%;background:var(--pc);flex:none}
.nav a span{flex:1;min-width:0}
.nav a em{font-style:normal;font-family:var(--m);font-size:12px;color:var(--muted2);background:var(--soft);border-radius:6px;padding:1px 7px}
.people{padding:14px 16px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.person{display:flex;gap:10px;align-items:flex-start}
.person .av{width:32px;height:32px;border-radius:50%;background:color-mix(in srgb,var(--secondary) 14%,transparent);color:var(--secondary);display:grid;place-items:center;flex:none}
.person .av .ic{width:16px;height:16px}
.person .role{display:block;font-size:11.5px;font-weight:600;color:var(--muted2);line-height:1.3}
.person .name{display:block;font-size:14px;font-weight:700;line-height:1.3}
.person .psub{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.scrim{position:fixed;inset:0;background:rgba(2,6,23,.45);z-index:25;opacity:0;pointer-events:none;transition:opacity .2s}

/* ---------- основная часть ---------- */
.main{margin-left:var(--sb);min-width:0}
.tb{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:14px 32px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tb .ttl{min-width:0;flex:1}
.tb h1{font-size:20px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;width:min(340px,40vw)}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted2);width:16px;height:16px}
.search input{width:100%;height:40px;border:1px solid var(--line2);border-radius:10px;background:var(--card);padding:0 12px 0 36px;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--secondary);box-shadow:0 0 0 3px color-mix(in srgb,var(--secondary) 18%,transparent)}
.ib{width:40px;height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;color:var(--muted);transition:border-color .2s,color .2s;flex:none}
.ib:hover{border-color:var(--secondary);color:var(--fg)}
.menu{display:none}
.wrap{padding:28px 40px 64px;max-width:1080px}
.lead{font-size:16px;color:var(--muted);max-width:72ch;margin:0 0 22px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh1);margin-bottom:8px;overflow:hidden}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi b{font-family:var(--m);font-size:30px;font-weight:600;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .lbl{font-size:13px;font-weight:500;color:var(--muted);line-height:1.35}

/* ---------- дорожная карта ---------- */
#phases{margin-top:12px}
.sec{--pc:var(--c1);--pad:80px;--sx:24px;--node:48px;position:relative;padding:44px 0 0 var(--pad)}
.sec::before{content:'';position:absolute;left:calc(var(--sx) - 1px);top:0;bottom:0;width:2px;background:var(--line2)}
.sec:first-child::before{top:calc(44px + var(--node) / 2)}
.sec:last-child{padding-bottom:8px}
.sec:last-child::before{bottom:auto;height:100%;-webkit-mask:linear-gradient(#000 85%,transparent);mask:linear-gradient(#000 85%,transparent)}
.node{position:absolute;left:calc(var(--sx) - var(--node) / 2);top:44px;width:var(--node);height:var(--node);border-radius:50%;background:var(--pc);color:var(--on-node);display:grid;place-items:center;font:700 19px/1 var(--f);font-variant-numeric:tabular-nums;box-shadow:0 0 0 6px var(--bg)}
.sh{min-height:var(--node);display:flex;flex-direction:column;justify-content:center;gap:8px;margin-bottom:18px}
.sh h2{font-size:24px;font-weight:700;letter-spacing:-.015em;line-height:1.2;text-wrap:balance}
.sh .pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:13px;font-weight:500;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 11px;white-space:nowrap}
.pill b{font-weight:700;color:var(--fg);margin-right:4px;font-variant-numeric:tabular-nums}
.rm{display:flex;flex-direction:column;gap:14px}

/* карточки направлений, подвешенные к оси */
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 24px 22px;box-shadow:var(--sh1);transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:color-mix(in srgb,var(--pc) 45%,var(--line));box-shadow:var(--sh2)}
.card::before{content:'';position:absolute;left:calc(var(--sx) - var(--pad) - 1px);top:31px;width:calc(var(--pad) - var(--sx));height:2px;background:var(--line2)}
.card::after{content:'';position:absolute;left:calc(var(--sx) - var(--pad) - 6px);top:26px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--pc)}
.ch{display:flex;gap:12px;align-items:baseline;margin-bottom:14px}
.ch h3{font-size:17px;font-weight:700;line-height:1.35;flex:1;min-width:0;text-wrap:balance}
.cnt{font-size:13px;font-weight:500;color:var(--muted2);white-space:nowrap;flex:none}
.cnt b{color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}
.items{display:flex;flex-direction:column;gap:12px;max-width:75ch}
.it{display:flex;gap:11px}
.it>.ic{width:17px;height:17px;color:var(--pc);margin-top:3px}
.it.nod{gap:0}.it.nod>.ic{display:none}
.it>div{flex:1;min-width:0}
.it .t{font-size:15px;font-weight:400;line-height:1.5}
.it .t.s{font-weight:600}
.it .d{font-size:14px;color:var(--muted);margin-top:3px;line-height:1.5}
.sub{margin-top:8px;display:flex;flex-direction:column;gap:6px;font-size:14.5px;color:var(--muted);line-height:1.45}
.sub>div{position:relative;padding-left:16px}
.sub>div::before{content:'';position:absolute;left:3px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--line2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.it.nod .chips{margin-top:0}
.it.nod+.it.nod{margin-top:2px;padding-top:12px;border-top:1px dashed var(--line)}
.chip{font-size:13px;font-weight:500;padding:3px 9px;border-radius:7px;background:var(--soft);border:1px solid var(--line);line-height:1.45}
.lnk{display:inline-flex;align-items:flex-start;overflow-wrap:anywhere;min-width:0;gap:6px;margin-top:6px;font-size:14px;font-weight:600;color:var(--secondary);text-decoration:none;text-underline-offset:3px}
.lnk:hover{text-decoration:underline}
.lnk .ic{width:14px;height:14px;margin-top:3px}
.links{display:flex;flex-direction:column}
.note{margin-top:16px;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;max-width:75ch}
.note.p{background:color-mix(in srgb,var(--pc) 10%,transparent);color:var(--fg)}
.contacts{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.contacts .cl{font-size:13px;font-weight:600;color:var(--muted2)}
.contacts .cr{font-size:14.5px}
.contacts .cr b{font-weight:600;margin-right:6px}
.contacts .txt{color:var(--muted)}

/* пайплайн обработки лида: вертикальные шаги */
.flow{display:flex;flex-direction:column;max-width:78ch}
.step{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);column-gap:16px;padding-bottom:20px}
.step:last-child{padding-bottom:0}
.step::before{content:'';position:absolute;left:15px;top:36px;bottom:4px;width:2px;background:color-mix(in srgb,var(--pc) 30%,var(--line))}
.step:last-child::before{display:none}
.step .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--pc) 12%,var(--card));border:2px solid var(--pc);color:var(--fg);font-style:normal;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.step .sc{display:flex;flex-direction:column;gap:6px;padding-top:4px;min-width:0}
.step .shd{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.step h4{font-size:16px;font-weight:700;line-height:1.35}
.step .role{font-size:13px;font-weight:500;color:var(--muted);background:var(--soft);border-radius:6px;padding:1px 8px}
.step p{font-size:14.5px;color:var(--muted);line-height:1.5}
.step p.hl{color:var(--fg);font-weight:600}
.step .chips{margin-top:2px}
.step .ex{display:flex;gap:6px;align-items:flex-start;font-size:14px;font-weight:600;color:var(--danger)}
.step .lp{display:flex;gap:6px;align-items:flex-start;font-size:14px;font-weight:600;color:var(--danger);border:1px dashed color-mix(in srgb,var(--danger) 50%,transparent);border-radius:9px;padding:6px 10px;align-self:flex-start}
.step .ic{width:15px;height:15px;margin-top:3px}
.exits{margin-top:22px;border:1px solid color-mix(in srgb,var(--danger) 30%,var(--line));background:color-mix(in srgb,var(--danger) 5%,var(--card));border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;max-width:78ch}
.exits b{display:flex;gap:8px;align-items:center;color:var(--danger);font-size:15px}
.exits .chip{color:var(--danger);background:transparent;border-color:color-mix(in srgb,var(--danger) 35%,transparent);font-weight:600}
.exits .txt{color:var(--muted)}
.flowfoot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;font-size:14px;color:var(--muted)}
.flowfoot .chip{color:var(--danger);background:transparent;border-color:color-mix(in srgb,var(--danger) 35%,transparent);font-weight:600}

/* расписание дня */
.daycard{padding:6px 24px}
.tl{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:112px minmax(0,1fr);column-gap:20px;padding:14px 0}
.row+.row{border-top:1px solid var(--line)}
.row .tm{font-size:14px;font-weight:700;color:var(--fg);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.5}
.rb{display:flex;flex-direction:column;gap:8px;min-width:0}
.rt{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}
.rt b{font-size:16px;font-weight:700;line-height:1.4}
.rt .pl{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;color:var(--muted)}
.rt .pl .ic{width:14px;height:14px;align-self:center}
.row .chips{margin-top:0}
.row .chip{background:color-mix(in srgb,var(--pc) 8%,var(--card));border-color:color-mix(in srgb,var(--pc) 24%,var(--line))}
.mto{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mto .ml{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--muted);margin-right:2px}
.mto .ml .ic{width:14px;height:14px}
.mto .mc{font-size:13px;color:var(--muted);background:var(--soft);border-radius:6px;padding:2px 8px}
.rn{font-size:13.5px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:6px 10px;align-self:flex-start}
.row.life{padding:10px 0}
.row.life .tm,.row.life .rt b{color:var(--muted);font-weight:500}
.row.life .rt b{font-size:15px}

.src{margin-top:40px;font-size:12.5px;color:var(--muted2)}
.empty{display:none;padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:14px;margin-top:20px}
.hidden{display:none!important}

/* редактор */
.pen{position:absolute;z-index:40;width:28px;height:28px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--secondary);display:none;place-items:center;box-shadow:var(--sh2);padding:0}
.pen.on{display:grid}
.pen .ic{width:14px;height:14px}
[data-ek].editing{outline:2px dashed var(--secondary);outline-offset:3px;border-radius:4px;background:color-mix(in srgb,var(--secondary) 8%,transparent);cursor:text}
[data-ek].gone{display:none!important}

/* адаптив */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi:nth-child(4){border-left:0}.kpi:nth-child(n+4){border-top:1px solid var(--line)}}

@media (max-width:1023px){
  .sb{transform:translateX(-102%)}body.nav-open .sb{transform:none}body.nav-open .scrim{opacity:1;pointer-events:auto}
  .main{margin-left:0}.menu{display:grid}
}
@media (max-width:700px){
  .tb{padding:10px 16px;gap:10px;flex-wrap:wrap}.tb .ttl{order:1}.menu{order:0}.tb .ib.th{order:2}.search{order:3;width:100%}
  .tb h1{font-size:17px;white-space:normal}
  .wrap{padding:20px 16px 48px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi b{font-size:26px}.kpi{border-left:0;border-top:1px solid var(--line)}.kpi:nth-child(-n+2){border-top:0}.kpi:nth-child(2n){border-left:1px solid var(--line)}.kpi:last-child:nth-child(odd){grid-column:1/-1}
  .sec{--pad:44px;--sx:15px;--node:32px;padding-top:36px}.sec:first-child::before{top:calc(36px + var(--node) / 2)}.node{top:36px;font-size:15px;box-shadow:0 0 0 4px var(--bg)}
  .sh h2{font-size:20px}.card{padding:16px 16px 18px}.card::before{top:27px}.card::after{top:22px}.ch{flex-direction:column;gap:2px}
  .daycard{padding:4px 16px}.row{grid-template-columns:1fr;row-gap:4px}
}
@media print{.sb,.tb,.pen,.scrim{display:none!important}.main{margin-left:0}.card,.panel{break-inside:avoid;box-shadow:none}}

/* ---------- вход ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.lbox{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh2);padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.lhd{display:flex;align-items:center;gap:12px}
.lbox h1{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.lbox p{font-size:14px;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.fld input{height:44px;border:1px solid var(--line2);border-radius:10px;background:var(--card);padding:0 12px;font-size:15px;font-weight:400;color:var(--fg);outline:none;transition:border-color .2s,box-shadow .2s}
.fld input:focus{border-color:var(--secondary);box-shadow:0 0 0 3px color-mix(in srgb,var(--secondary) 18%,transparent)}
.btn{height:44px;border:0;border-radius:10px;background:var(--secondary);color:var(--on-sec);font-weight:600;font-size:15px;transition:filter .2s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:progress}
.lerr{min-height:20px;font-size:13.5px;font-weight:600;color:var(--danger)}
.app.hidden,.login.hidden{display:none}

/* ---------- вкладки ---------- */
.tb{flex-wrap:wrap;row-gap:0;padding-bottom:0}
.tabs{order:10;flex:1 0 100%;display:flex;align-items:flex-end;gap:4px;margin-top:10px;min-width:0}
.tabs nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs nav::-webkit-scrollbar{display:none}
.tab{position:relative;height:42px;padding:0 14px;border:0;background:none;color:var(--muted);font-weight:600;font-size:14.5px;white-space:nowrap;border-radius:8px 8px 0 0;transition:color .2s,background-color .2s}
.tab:hover{color:var(--fg);background:var(--soft)}
.tab[aria-selected="true"]{color:var(--fg)}
.tab[aria-selected="true"]::after{content:'';position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--secondary)}
.tools{display:flex;align-items:center;gap:6px;padding-bottom:6px;flex:none}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--muted);padding:6px 10px;border-radius:8px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted2);flex:none}
.sync.ok i{background:var(--accent)}
.sync.bad{color:var(--danger)}.sync.bad i{background:var(--danger)}
.sync.busy i{background:var(--warn)}
.chg{height:34px;border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:0 11px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;transition:border-color .2s,color .2s}
.chg:hover{border-color:var(--secondary);color:var(--fg)}
.chg .ic{width:15px;height:15px}
.chg b{color:var(--fg);font-variant-numeric:tabular-nums}
.out{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:13px;font-weight:600;color:var(--muted);background:none;border:0;padding:6px 0}
.out:hover{color:var(--fg)}
.out .ic{width:15px;height:15px}

/* ---------- журнал правок ---------- */
dialog.edl{width:min(720px,calc(100vw - 32px));max-height:min(80vh,760px);border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--fg);padding:0;box-shadow:var(--sh2)}
dialog.edl::backdrop{background:rgba(2,6,23,.45)}
.edh{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.edh h2{font-size:18px;font-weight:700;flex:1}
.edb{padding:8px 20px 20px;display:flex;flex-direction:column}
.er{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:14px 0;border-bottom:1px solid var(--line)}
.er:last-child{border-bottom:0}
.er .w{font-size:12.5px;color:var(--muted2);grid-column:1}
.er .o{font-size:14px;color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--danger) 60%,transparent)}
.er .n{font-size:14.5px;font-weight:600}
.er .n.e{font-weight:500;color:var(--danger)}
.er button{grid-column:2;grid-row:1/span 3;align-self:center;height:34px;border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:0 12px;font-weight:600;font-size:13px;color:var(--fg)}
.er button:hover{border-color:var(--secondary)}
.edb .none{padding:24px 0;color:var(--muted);font-size:14.5px}

/* ---------- общий масштаб ---------- */
.node.ab{font-size:13px;letter-spacing:-.01em}
.share{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh1);padding:20px 24px;margin-top:14px}
.share h3{font-size:17px;font-weight:700;margin-bottom:14px}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;background:var(--soft)}
.bar span{display:block;height:100%;background:var(--pc)}
.lg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.lg>div{display:flex;gap:10px;align-items:flex-start}
.lg i{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none;margin-top:6px}
.lg b{display:block;font-size:15px;font-weight:700;line-height:1.4}
.lg span{display:block;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.open{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--secondary);background:none;border:0;padding:4px 0}
.open:hover{text-decoration:underline;text-underline-offset:3px}
.open .ic{width:15px;height:15px}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0}
.stg{padding:2px 16px 4px;border-left:1px solid var(--line);min-width:0}
.stg:first-child{border-left:0;padding-left:0}
.stg h4{font-size:15px;font-weight:700;line-height:1.35}
.stg .sm{font-size:13px;color:var(--muted);margin:3px 0 10px;font-variant-numeric:tabular-nums}
.stg ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.stg li{font-size:13.5px;line-height:1.4;padding-left:13px;position:relative}
.stg li::before{content:'';position:absolute;left:0;top:.55em;width:5px;height:5px;border-radius:50%;background:var(--pc)}
.stg li.lf{color:var(--muted)}
.stg li.lf::before{background:var(--line2)}
@media (max-width:1023px){.lg{grid-template-columns:1fr}}
@media (max-width:700px){
  .tabs{margin-top:8px;flex-wrap:wrap}.tools{order:-1;flex:1 0 100%;justify-content:space-between;padding-bottom:2px}
  .share{padding:16px}
  .stages{grid-template-columns:1fr}.stg{border-left:0;padding:12px 0;border-top:1px solid var(--line)}.stg:first-child{border-top:0;padding-top:0}
}
@media print{.tabs,.login{display:none!important}}
</style>
</head>
<body>
<div class="login" id="login">
  <form class="lbox" id="lform" autocomplete="on">
    <div class="lhd"><div class="logo"><svg class="ic" viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg></div>
    <h1>Объём работы лидерской программы</h1></div>
    <p>Данные зашифрованы. Войдите тем же логином и паролем, что и в календаре стратсессии.</p>
    <label class="fld">Логин<input id="lu" name="username" autocomplete="username" required></label>
    <label class="fld">Пароль<input id="lp" name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn" id="lbtn" type="submit">Войти</button>
    <div class="lerr" id="lerr" role="alert"></div>
  </form>
</div>

<div class="app hidden" id="app">
<aside class="sb" id="sb" aria-label="Навигация">
  <div class="brand"><div class="logo"><svg class="ic" viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg></div>
    <div><small>«100 Лидеров»</small><span class="dept" id="bdept"></span></div></div>
  <nav class="nav" id="nav"></nav>
  <div class="people" id="people"></div>
</aside>
<div class="scrim" id="scrim"></div>
<div class="main">
  <header class="tb">
    <button class="ib menu" id="menu" aria-label="Открыть навигацию"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="ttl"><h1 id="h1"></h1></div>
    <label class="search"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="q" type="search" placeholder="Поиск по задачам и направлениям" aria-label="Поиск по задачам и направлениям"></label>
    <button class="ib th" id="theme" aria-label="Светлая / тёмная тема" title="Светлая / тёмная тема"></button>
    <div class="tabs">
      <nav role="tablist" aria-label="Разделы" id="tabs"></nav>
      <div class="tools"><span class="sync" id="sync" role="status"><i></i><span>Загрузка…</span></span><button class="chg" id="chg" type="button"></button></div>
    </div>
  </header>
  <div class="wrap">
    <p class="lead" id="lead"></p>
    <section class="kpis" id="kpis" aria-label="Ключевые цифры"></section>
    <main id="phases"></main>
    <div class="empty" id="empty">Ничего не найдено. Попробуйте другое слово.</div>
    <p class="src" id="src"></p>
  </div>
</div>
</div>
<button class="pen" id="pen" type="button" title="Редактировать" aria-label="Редактировать"><svg class="ic" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
<dialog class="edl" id="edl" aria-labelledby="edlt"><div class="edh"><h2 id="edlt">Правки</h2><button class="ib" id="edlx" type="button" aria-label="Закрыть"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><div class="edb" id="edb"></div></dialog>
<script>
'use strict';
/* ---------- утилиты ---------- */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c};
const I={
 check:'<path d="M20 6 9 17l-5-5"/>',
 clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
 box:'<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
 user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
 alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
 loop:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
 ext:'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
 arrow:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
 hist:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
 out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const mk=S=>({g(k){try{return S().getItem(k)}catch(e){return null}},s(k,v){try{S().setItem(k,v)}catch(e){}},d(k){try{S().removeItem(k)}catch(e){}}});
const ls=mk(()=>localStorage),ss=mk(()=>sessionStorage);

/* ---------- шифрование (тот же ключ и пользователи, что в календаре стратсессии) ---------- */
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=b=>{const u=new Uint8Array(b);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const aesDec=async(k,iv,ct)=>new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(iv)},k,ub64(ct)));
const aesEnc=async(k,bytes)=>{const iv=crypto.getRandomValues(new Uint8Array(12));return {iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,bytes))}};
let KEY=null,USER='',DATA=null,TAB='all',ED={},SYNC=null;
const encJSON=o=>aesEnc(KEY,enc.encode(JSON.stringify(o)));
const decJSON=async o=>JSON.parse(dec.decode(await aesDec(KEY,o.iv,o.ct)));
const getJSON=async f=>{const r=await fetch(f+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Нет файла '+f);return r.json()};

async function login(u,p){
  const data=await getJSON('data.enc.json');u=u.trim().toLowerCase();
  const id=await sha('strat:'+u),e=data.users.find(x=>x.u===id);
  if(!e)throw new Error('Неверный логин или пароль');
  const base=await crypto.subtle.importKey('raw',enc.encode(u+':'+p),'PBKDF2',false,['deriveKey']);
  const kek=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:ub64(e.salt),iterations:e.it||data.iter},base,{name:'AES-GCM',length:256},false,['decrypt']);
  let raw;try{raw=await aesDec(kek,e.iv,e.wk)}catch(_){throw new Error('Неверный логин или пароль')}
  ss.s('vol.k',b64(raw));ss.s('vol.u',u);await openApp(raw,u,data);
}
async function openApp(raw,u,data){
  KEY=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);USER=u;
  data=data||await getJSON('data.enc.json');DATA=await decJSON(data);
  ED=await readLocal();
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  TAB=ss.g('vol.tab')||(location.hash.slice(1).split('-')[0]in DATA.depts?location.hash.slice(1).split('-')[0]:'all');
  if(TAB!=='all'&&!DATA.depts[TAB])TAB='all';
  render();syncPull();
}
$('#lform').addEventListener('submit',async e=>{e.preventDefault();const b=$('#lbtn');b.disabled=true;b.textContent='Проверяю…';$('#lerr').textContent='';
  try{await login($('#lu').value,$('#lp').value)}catch(err){$('#lerr').textContent=err.message}b.disabled=false;b.textContent='Войти'});
(async()=>{const k=ss.g('vol.k')||ss.g('strat.k'),u=ss.g('vol.u')||ss.g('strat.u');if(k&&u){try{await openApp(ub64(k),u)}catch(e){ss.d('vol.k')}}})();

/* ---------- подсчёт объёма ---------- */
const DEP=['op','oo','otis'],COL={op:'--c1',oo:'--c2',otis:'--c3'},ABBR={op:'ОП',oo:'ОО',otis:'ОТиС'};
const cItem=it=>typeof it==='string'?1:it.links?it.links.length:it.link?0:(it.sub?it.sub.length:1);
const cBlock=(D,b)=>b.flow?(D.FLOW||[]).length:Math.max(1,b.items.reduce((s,i)=>s+cItem(i),0));
const cDay=d=>d.reduce((s,r)=>s+1+r[3].length,0);
const cPhase=(D,p)=>p.day?cDay(p.day):p.b.reduce((s,b)=>s+cBlock(D,b),0);
const total=D=>D.P.reduce((s,p)=>s+cPhase(D,p),0);
const nDir=D=>D.P.reduce((s,p)=>s+(p.b?p.b.length:p.day.length),0);
const unitP=p=>p.day?['задача','задачи','задач']:['действие','действия','действий'];
const KPI={
  op:D=>{const nB=D.P.reduce((s,p)=>s+(p.b?p.b.length:0),0),T=total(D),F=(D.FLOW||[]).length;return [[D.P.length,plural(D.P.length,'этап','этапа','этапов')+' работы'],[nB,plural(nB,'направление','направления','направлений')],[T,plural(T,'действие','действия','действий')+' и критериев'],[F,plural(F,'шаг','шага','шагов')+' обработки лида'],[4,'среза отчётности в день']]},
  oo:D=>{const P=D.P,nPrep=P[0].b.length,Ds=P.filter(p=>p.day),nRows=Ds.reduce((s,p)=>s+p.day.length,0),nM=Ds.reduce((s,p)=>s+p.day.reduce((x,r)=>x+r[4].length,0),0),T=total(D);return [[P.length,plural(P.length,'этап','этапа','этапов')+' работы'],[nPrep,plural(nPrep,'направление','направления','направлений')+' подготовки'],[nRows,plural(nRows,'пункт','пункта','пунктов')+' расписания за 3 дня'],[T,plural(T,'задача','задачи','задач')+' и действий'],[nM,plural(nM,'позиция','позиции','позиций')+' МТО в расписании']]},
  otis:D=>{const nB=D.P.reduce((s,p)=>s+p.b.length,0),T=total(D);return [[D.P.length,plural(D.P.length,'этап','этапа','этапов')+' работы'],[nB,plural(nB,'направление','направления','направлений')],[T,plural(T,'действие','действия','действий')],[4,'дня собеседований в неделю']]}
};

/* ---------- отрисовка отдела ---------- */
function item(it){
  const o=typeof it==='string'?{t:it}:it;
  const sub=o.sub?(o.chips?`<div class="chips">${o.sub.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:`<div class="sub">${o.sub.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`):'';
  const L=o.links?o.links.map(x=>Array.isArray(x)?x:[x.replace('https://',''),x]):(o.link?[['Открыть отчёт',o.link]]:[]);
  const links=L.length?`<div class="links">${L.map(([l,u])=>`<a class="lnk" href="${esc(u)}" target="_blank" rel="noopener">${ic('ext')}${esc(l)}</a>`).join('')}</div>`:'';
  return `<div class="it${o.t?'':' nod'}">${ic('check')}<div>${o.t?`<div class="t${o.sub||o.d||L.length?' s':''}">${esc(o.t)}</div>`:''}${o.d&&!o.sub?`<div class="d">${esc(o.d)}</div>`:''}${sub}${o.d&&o.sub?`<div class="d" style="margin-top:6px">${esc(o.d)}</div>`:''}${links}</div></div>`;
}
function flow(D){
  const FL=D.FLOW||[];
  return `<div class="flow">${FL.map((s,i)=>`<div class="step">
    <i class="num" aria-hidden="true">${i+1}</i><div class="sc">
    <div class="shd"><h4>${esc(s.t)}</h4>${s.w?`<span class="role">${esc(s.w)}</span>`:''}</div><p>${esc(s.d)}</p>${s.note?`<p class="hl">${esc(s.note)}</p>`:''}
    ${(s.ex||[]).map(e=>`<div class="ex">${ic('alert')}<span>${esc(e)}</span></div>`).join('')}
    ${s.loop?`<div class="lp">${ic('loop')}<span>${esc(s.loop.replace(/^↺\s*/,''))}</span></div>`:''}
    ${s.bx?`<div class="chips">${s.bx.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:''}
  </div></div>`).join('')}</div>
  ${D.EXITS?`<div class="exits"><b>${ic('alert')}<span class="et">Отказ и самоотказ возможны с любой стадии</span></b>${D.EXITS.map(([a,b])=>`<div><span class="chip">${esc(a)}</span> — <span class="txt">${esc(b)}</span></div>`).join('')}</div>`:''}
  ${D.ALWAYS?`<div class="flowfoot"><span class="lbl">Также с любой стадии:</span> ${D.ALWAYS.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:''}`;
}
function dayRows(rows){
  return `<div class="tl">${rows.map(([tm,t,pl,tasks,mto,note,life])=>`<div class="row${life?' life':''}">
    <span class="tm">${esc(tm)}</span>
    <div class="rb"><div class="rt"><b>${esc(t)}</b><span class="pl">${ic('pin')}<span class="plt">${esc(pl)}</span></span></div>
      ${tasks.length?`<div class="chips">${tasks.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:''}
      ${mto.length?`<div class="mto"><span class="ml">${ic('box')}МТО</span>${mto.map(x=>`<span class="mc">${esc(x)}</span>`).join('')}</div>`:''}
      ${note?`<div class="rn">${esc(note)}</div>`:''}
    </div></div>`).join('')}</div>`;
}
const card=(D,b)=>{const n=cBlock(D,b);return `<article class="card${b.flow?' flowcard':''}">
  <div class="ch"><h3>${esc(b.t)}</h3><span class="cnt"><b>${n}</b> ${plural(n,'действие','действия','действий')}</span></div>
  ${b.flow?flow(D):b.items.length?`<div class="items">${b.items.map(item).join('')}</div>`:''}
  ${b.contacts?`<div class="contacts"><div class="cl">Контакты подразделений</div>${b.contacts.map(([a,d])=>`<div class="cr"><b>${esc(a)}</b>${d?`<span class="txt">${esc(d)}</span>`:''}</div>`).join('')}</div>`:''}
  ${b.note?`<div class="note${b.np?' p':''}">${esc(b.note)}</div>`:''}
</article>`};
const kpiHTML=list=>{$('#kpis').style.setProperty('--n',list.length);$('#kpis').innerHTML=list.map(([v,l])=>`<div class="kpi"><b>${v}</b><span class="lbl">${esc(l)}</span></div>`).join('')};
const personHTML=p=>`<div class="person"><span class="av">${ic('user')}</span><div><span class="role">${esc(p[0])}</span><span class="name">${esc(p[1])}</span>${p[2]?`<span class="psub">${esc(p[2])}</span>`:''}</div></div>`;
const outBtn=`<button class="out" id="logout" type="button">${ic('out')}Выйти</button>`;

function renderDept(k){
  const D=DATA.depts[k];
  document.title='Объём работы · '+ABBR[k];
  $('#bdept').textContent=D.dept;$('#h1').textContent=D.h1;$('#lead').textContent=D.lead;$('#src').textContent=D.src;
  $('#people').innerHTML=D.people.map(personHTML).join('')+outBtn;
  $('#nav').innerHTML='<div class="nh">Этапы работы</div>'+D.P.map((p,i)=>`<a href="#${k}-s${i}" data-s="${k}-s${i}" style="--pc:var(${p.c})"><i></i><span>${esc(p.t)}</span><em>${cPhase(D,p)}</em></a>`).join('');
  kpiHTML(KPI[k](D));
  $('#phases').innerHTML=D.P.map((p,i)=>{
    const n=cPhase(D,p),u=unitP(p);
    const pills=p.day?`<span class="pill"><b>${p.day.length}</b>${plural(p.day.length,'пункт','пункта','пунктов')} расписания</span><span class="pill"><b>${n}</b>${plural(n,...u)}</span><span class="pill"><b>${p.day.reduce((s,r)=>s+r[4].length,0)}</b>МТО</span>`
      :`<span class="pill"><b>${p.b.length}</b>${plural(p.b.length,'направление','направления','направлений')}</span><span class="pill"><b>${n}</b>${plural(n,...u)}</span>`;
    return `<section class="sec" id="${k}-s${i}" style="--pc:var(${p.c})">
      <span class="node" aria-hidden="true">${i+1}</span>
      <div class="sh"><h2>${esc(p.t)}</h2><div class="pills">${pills}</div></div>
      <div class="rm">${p.day?`<article class="card daycard">${dayRows(p.day)}</article>`:p.b.map(b=>card(D,b)).join('')}</div>
    </section>`}).join('');
  markEditable();applyEdits();
}

/* ---------- общий масштаб ---------- */
const edv=(t,k,orig)=>{const e=(ED[t]||{})[k];return e&&!e.reset&&typeof e.v==='string'?e.v:orig};
function renderAll(){
  document.title='Объём работы лидерской программы';
  const ds=DEP.map(k=>({k,D:DATA.depts[k]}));
  const tot=ds.map(({k,D})=>({k,D,T:total(D),B:D.P.reduce((s,p)=>s+(p.b?p.b.length:0),0),S:D.P.length}));
  const sum=f=>tot.reduce((s,x)=>s+x[f],0),ST=sum('T');
  $('#bdept').textContent='Лидерская программа';$('#h1').textContent='Объём работы лидерской программы';
  $('#lead').textContent='Совокупный объём работы трёх отделов лидерской программы: отдела продаж, отдела организации и отдела трудоустройства и сопровождения. Подробности по каждому отделу — во вкладках.';
  $('#src').textContent='Цифры посчитаны по схемам работ отделов так же, как во вкладках. Направления дней программы ОО — пункты расписания.';
  const head=DATA.depts.oo.people[0];
  $('#people').innerHTML=[head,...ds.map(({D})=>D.people[1])].map(personHTML).join('')+outBtn;
  $('#nav').innerHTML='<div class="nh">Отделы</div>'+tot.map(({k,D,T})=>`<a href="#all-${k}" data-s="all-${k}" style="--pc:var(${COL[k]})"><i></i><span>${esc(edv(k,'.brand .dept#0',D.dept))}</span><em>${T}</em></a>`).join('');
  const nRows=DATA.depts.oo.P.filter(p=>p.day).reduce((s,p)=>s+p.day.length,0);
  kpiHTML([[3,'отдела'],[sum('S'),'этапов работы'],[sum('B'),'направлений'],[nRows,'пунктов расписания программы'],[ST,'действий и задач']]);
  const share=`<div class="share"><h3>Доля каждого отдела в общем объёме действий и задач</h3>
    <div class="bar" role="img" aria-label="${tot.map(x=>ABBR[x.k]+' '+x.T).join(', ')}">${tot.map(x=>`<span style="--pc:var(${COL[x.k]});width:${(x.T/ST*100).toFixed(2)}%"></span>`).join('')}</div>
    <div class="lg">${tot.map(x=>`<div style="--pc:var(${COL[x.k]})"><i></i><div><b>${esc(edv(x.k,'.brand .dept#0',x.D.dept))}</b><span>${x.T} ${plural(x.T,'действие','действия','действий')} · ${Math.round(x.T/ST*100)}%</span></div></div>`).join('')}</div></div>`;
  $('#phases').innerHTML=share+tot.map(({k,D,T,B,S})=>{
    let h=0,r=0;
    const cols=D.P.map((p,i)=>{
      const name=edv(k,'.sec h2#'+i,p.t),n=cPhase(D,p);
      let li;
      if(p.day)li=p.day.map(row=>{const t=edv(k,'.rt b#'+(r++),row[1]);return t?`<li class="${row[6]?'lf':''}">${esc(t)}</li>`:''}).join('');
      else li=p.b.map(b=>{const t=edv(k,'.card h3#'+(h++),b.t);return t?`<li>${esc(t)}</li>`:''}).join('');
      const cnt=p.day?`${p.day.length} ${plural(p.day.length,'пункт','пункта','пунктов')} · ${n} ${plural(n,'задача','задачи','задач')}`:`${p.b.length} ${plural(p.b.length,'направление','направления','направлений')} · ${n} ${plural(n,'действие','действия','действий')}`;
      return name?`<div class="stg"><h4>${esc(name)}</h4><div class="sm">${cnt}</div><ul>${li}</ul></div>`:'';
    }).join('');
    const resp=D.people[1];
    return `<section class="sec" id="all-${k}" style="--pc:var(${COL[k]})">
      <span class="node ab" aria-hidden="true">${ABBR[k]}</span>
      <div class="sh"><h2>${esc(edv(k,'.brand .dept#0',D.dept))}</h2><div class="pills"><span class="pill"><b>${S}</b>${plural(S,'этап','этапа','этапов')}</span><span class="pill"><b>${B}</b>${plural(B,'направление','направления','направлений')}</span><span class="pill"><b>${T}</b>${plural(T,'действие','действия','действий')}</span><button class="open" type="button" data-go="${k}">Открыть вкладку ${ABBR[k]}${ic('arrow')}</button></div></div>
      <div class="rm"><article class="card"><div class="ch"><h3>${esc(resp[0])}: ${esc(resp[1])}</h3></div><div class="stages">${cols}</div></article></div>
    </section>`}).join('');
  $$('[data-go]').forEach(b=>b.onclick=()=>setTab(b.dataset.go));
}

/* ---------- вкладки и общий рендер ---------- */
const TABS=[['all','Общий масштаб'],['op','ОП'],['oo','ОО'],['otis','ОТиС']];
let io=null;
function render(){
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab" role="tab" type="button" aria-selected="${k===TAB}" data-t="${k}">${l}</button>`).join('');
  $$('#tabs .tab').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
  $('#q').value='';$('#empty').style.display='none';$('#kpis').classList.remove('hidden');
  pen.classList.remove('on');
  TAB==='all'?renderAll():renderDept(TAB);
  $('#logout').onclick=logout;
  $$('#nav a').forEach(a=>a.addEventListener('click',()=>document.body.classList.remove('nav-open')));
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)$$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.s===e.target.id))})},{rootMargin:'-90px 0px -60% 0px'});
  $$('.sec').forEach(s=>io.observe(s));
  paintChg();
}
function setTab(t){if(t===TAB)return;TAB=t;ss.s('vol.tab',t);render();scrollTo({top:0,behavior:'auto'})}
function logout(){ss.d('vol.k');ss.d('vol.u');ss.d('vol.tab');location.reload()}

/* ---------- тема и мобильное меню ---------- */
const R=document.documentElement;
const dark=()=>R.dataset.theme?R.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
const paint=()=>{$('#theme').innerHTML=ic(dark()?'sun':'moon')};
if(ls.g('vol.theme'))R.dataset.theme=ls.g('vol.theme');paint();
$('#theme').onclick=()=>{R.dataset.theme=dark()?'light':'dark';ls.s('vol.theme',R.dataset.theme);paint()};
$('#menu').onclick=()=>document.body.classList.add('nav-open');
$('#scrim').onclick=()=>document.body.classList.remove('nav-open');
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('nav-open')});

/* ---------- редактирование по карандашу ---------- */
const SEL=['.brand .dept','.tb h1','.lead','.person .role','.person .name','.person .psub','.kpi .lbl','.sec h2','.card h3','.it .t','.it .d','.sub>div','.chip','.step .role','.step h4','.step p','.step .ex span','.step .lp span','.note','.exits .et','.exits .txt','.flowfoot .lbl','.row .tm','.rt b','.rt .plt','.mto .mc','.rn','.contacts .cr b','.contacts .txt','.src'];
function markEditable(){SEL.forEach(s=>$$(s).forEach((el,i)=>{if(!el.dataset.ek){el.dataset.ek=s+'#'+i;el.dataset.o=el.textContent}}))}
const elOf=k=>document.querySelector(`[data-ek="${CSS.escape(k)}"]`);
function applyEdits(){if(TAB==='all')return;$$('[data-ek]').forEach(el=>{const e=(ED[TAB]||{})[el.dataset.ek],v=e&&!e.reset&&typeof e.v==='string'?e.v:el.dataset.o;el.textContent=v;el.classList.toggle('gone',!v.trim())});
  $$('.sec').forEach(s=>{const a=$(`#nav a[data-s="${s.id}"] span`),h=s.querySelector('h2');if(a&&h)a.textContent=h.textContent})}
const pen=$('#pen');let target=null,editing=null,hideT=0;
function placePen(el){const r=document.createRange();r.selectNodeContents(el);const rs=r.getClientRects();const last=rs.length?rs[rs.length-1]:el.getBoundingClientRect();
  let x=last.right+6,y=last.top+last.height/2-14;if(x+30>innerWidth)x=innerWidth-32;pen.style.left=(x+scrollX)+'px';pen.style.top=(y+scrollY)+'px';pen.classList.add('on');target=el}
document.addEventListener('pointerover',e=>{if(editing||!KEY)return;const el=e.target.closest&&e.target.closest('[data-ek]');
  if(el){clearTimeout(hideT);placePen(el)}else if(!e.target.closest('#pen')){clearTimeout(hideT);hideT=setTimeout(()=>{pen.classList.remove('on');target=null},350)}});
pen.addEventListener('pointerover',()=>clearTimeout(hideT));
pen.addEventListener('click',()=>{if(target)startEdit(target)});
function startEdit(el){
  editing=el;pen.classList.remove('on');const before=el.textContent;
  try{el.contentEditable='plaintext-only'}catch(e){}if(el.contentEditable!=='plaintext-only')el.contentEditable='true';
  el.classList.add('editing');el.focus();const sel=getSelection(),r=document.createRange();r.selectNodeContents(el);sel.removeAllRanges();sel.addRange(r);
  const done=save=>{el.removeEventListener('keydown',kd);el.removeEventListener('blur',bl);el.contentEditable='false';el.classList.remove('editing');editing=null;
    const v=el.textContent.replace(/\s+/g,' ').trim();if(!save||v===before.trim()){el.textContent=before;return}
    setEdit(TAB,el.dataset.ek,v,el.dataset.o)};
  const kd=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();el.blur()}else if(e.key==='Escape'){e.preventDefault();done(false)}};
  const bl=()=>done(true);el.addEventListener('keydown',kd);el.addEventListener('blur',bl);
}
async function setEdit(t,k,v,o){
  (ED[t]=ED[t]||{})[k]=v===o?{reset:1,a:USER,ts:Date.now()}:{v,o,a:USER,ts:Date.now()};
  if(t===TAB)applyEdits();paintChg();if($('#edl').open)drawLog();await persist();
}

/* ---------- журнал правок ---------- */
const live=()=>DEP.flatMap(t=>Object.entries(ED[t]||{}).filter(([,e])=>!e.reset).map(([k,e])=>({t,k,e}))).sort((a,b)=>b.e.ts-a.e.ts);
function paintChg(){const n=live().length;$('#chg').innerHTML=`${ic('hist')}Правки <b>${n}</b>`}
function drawLog(){
  const L=live();
  $('#edb').innerHTML=L.length?L.map(({t,k,e})=>`<div class="er"><span class="w">${ABBR[t]} · ${esc(e.a)} · ${new Date(e.ts).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'})}</span><span class="o">${esc(e.o||'')}</span><span class="n${e.v?'':' e'}">${e.v?esc(e.v):'Скрыто (текст удалён)'}</span><button type="button" data-t="${t}" data-k="${esc(k)}">Вернуть</button></div>`).join('')
    :'<p class="none">Правок пока нет. Наведите на любой текст во вкладке отдела и нажмите на карандаш.</p>';
  $$('#edb [data-k]').forEach(b=>b.onclick=()=>{const e=ED[b.dataset.t][b.dataset.k];setEdit(b.dataset.t,b.dataset.k,e.o,e.o).then(()=>{if(TAB==='all')render()})});
}
$('#chg').onclick=()=>{drawLog();$('#edl').showModal()};
$('#edlx').onclick=()=>$('#edl').close();
$('#edl').addEventListener('click',e=>{if(e.target===$('#edl'))$('#edl').close()});

/* ---------- хранение: браузер + зашифрованный файл в репозитории ---------- */
const mergeE=(a,b)=>{const out={};for(const t of DEP){out[t]={...(a&&a[t]||{})};for(const [k,v] of Object.entries(b&&b[t]||{}))if(!out[t][k]||v.ts>out[t][k].ts)out[t][k]=v}return out};
async function readLocal(){const s=ls.g('vol.e');if(!s)return {};try{return await decJSON(JSON.parse(s))}catch(e){return {}}}
const saveLocal=async()=>ls.s('vol.e',JSON.stringify(await encJSON(ED)));
function syncSt(t,c){const e=$('#sync');e.className='sync '+(c||'');e.querySelector('span').textContent=t}
// запасной путь к GitHub API через Cloudflare Worker на своём домене (xolchade.dev/gh/…)
(()=>{const F=window.fetch.bind(window),D='https://api.github.com/',P=location.origin+'/gh/',can=!/github\.io$/.test(location.hostname)&&location.protocol==='https:';
  let via=ss.g('strat.ghvia');
  window.fetch=async(u,o)=>{
    if(typeof u!=='string'||!u.startsWith(D)||!can)return F(u,o);
    if(via)return F(P+u.slice(D.length),o);
    const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);
    try{const r=await F(u,{...(o||{}),signal:c.signal});clearTimeout(t);return r}
    catch(e){clearTimeout(t);via='1';ss.s('strat.ghvia','1');return F(P+u.slice(D.length),o)}
  };
})();
const api=()=>`https://api.github.com/repos/${SYNC.repo}/contents/${SYNC.path}`;
const hdr=()=>({Authorization:'Bearer '+SYNC.token,Accept:'application/vnd.github+json'});
async function ghGet(){
  const r=await fetch(api()+'?t='+Date.now(),{headers:hdr(),cache:'no-store'});
  if(r.status===404)return {sha:null,data:{}};
  if(!r.ok)throw new Error('GitHub '+r.status);
  const j=await r.json();return {sha:j.sha,data:await decJSON(JSON.parse(dec.decode(ub64(j.content.replace(/\n/g,'')))))};
}
async function syncPull(){
  if(!SYNC){try{SYNC=await decJSON(await getJSON('sync.enc.json'))}catch(e){SYNC=null}}
  if(!SYNC){syncSt('Только в этом браузере','bad');return}
  try{syncSt('Синхронизация…','busy');const {data}=await ghGet();const before=JSON.stringify(mergeE(ED,{}));ED=mergeE(data,ED);await saveLocal();
    if(JSON.stringify(mergeE(data,{}))!==JSON.stringify(ED))await syncPush();else syncSt('Сохранено на сервере','ok');
    if(JSON.stringify(ED)!==before&&!editing){render()}}
  catch(e){syncSt('Сервер недоступен','bad')}
}
let pushing=null;
async function persist(){await saveLocal();if(!SYNC){syncSt('Только в этом браузере','bad');return}pushing=(pushing||Promise.resolve()).then(syncPush);await pushing}
async function syncPush(){
  for(let i=0;i<3;i++){
    try{
      syncSt('Сохраняю…','busy');
      const {sha,data}=await ghGet();ED=mergeE(data,ED);
      const body={message:'volume: edits update',content:b64(enc.encode(JSON.stringify(await encJSON(ED))))};if(sha)body.sha=sha;
      const r=await fetch(api(),{method:'PUT',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(r.status===409||r.status===422)continue;
      if(!r.ok)throw new Error('GitHub '+r.status);
      await saveLocal();syncSt('Сохранено на сервере','ok');return;
    }catch(e){syncSt('Не сохранено на сервере','bad');return}
  }
  syncSt('Конфликт, повторите правку','bad');
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&KEY&&SYNC&&!editing)syncPull()});

/* ---------- поиск ---------- */
$('#q').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();let any=false;
  if(TAB==='all'){
    $$('.sec').forEach(sec=>{let vis=0;sec.querySelectorAll('.stg li').forEach(li=>{const ok=!q||li.textContent.toLowerCase().includes(q);li.classList.toggle('hidden',!ok);if(ok)vis++});
      sec.querySelectorAll('.stg').forEach(s=>s.classList.toggle('hidden',!!q&&!s.querySelector('li:not(.hidden)')));
      sec.classList.toggle('hidden',!!q&&!vis);if(!q||vis)any=true});
    $('.share').classList.toggle('hidden',!!q);
  }else $$('.sec').forEach(sec=>{let vis=0;
    sec.querySelectorAll('.card:not(.flowcard):not(.daycard),.row,.step').forEach(x=>{const ok=!q||x.textContent.toLowerCase().includes(q);x.classList.toggle('hidden',!ok);if(ok)vis++});
    const fc=sec.querySelector('.flowcard');if(fc){const ok=!q||fc.querySelectorAll('.step:not(.hidden)').length||fc.querySelector('h3').textContent.toLowerCase().includes(q);fc.classList.toggle('hidden',!ok)}
    const dc=sec.querySelector('.daycard');if(dc){dc.classList.toggle('hidden',!!q&&!dc.querySelectorAll('.row:not(.hidden)').length)}
    sec.classList.toggle('hidden',!!q&&!vis);if(!q||vis)any=true});
  $('#empty').style.display=any?'none':'block';$('#kpis').classList.toggle('hidden',!!q);
});
</script>
