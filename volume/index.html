<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Объём работы лидерской программы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff;--ink:#000;--muted:#4b5563;--muted2:#6b7280;--line:#2b78e4;--main:#ffff00;--main-h:#f0f000;--sub:#ffe599;--sub-h:#ffd966;--soft:#f3f4f6;--soft-h:#e5e7eb;
  --warn:#92400e;--warn-bg:#fef3c7;--red:#b91c1c;--red-bg:#fef2f2;--ok:#15803d;--focus:#4f46e5;--hair:#e5e7eb;
  --f:'Balsamiq Sans',ui-rounded,'Segoe UI',system-ui,sans-serif;--fb:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
::selection{background:#fde047}
html{scrollbar-color:#9ca3af transparent;accent-color:var(--focus);caret-color:var(--focus)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
.hidden{display:none!important}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- вход ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.lbox{width:min(400px,100%);border:2px solid var(--ink);border-radius:10px;padding:26px 22px;display:flex;flex-direction:column;gap:14px;background:#fff}
.lbox h1{font-family:var(--f);font-size:26px;line-height:1.2}
.lbox p{font-size:14px;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.fld input{height:44px;border:2px solid var(--ink);border-radius:8px;background:#fff;padding:0 12px;font-size:15px;font-weight:400;color:var(--ink);outline:none}
.fld input:focus{box-shadow:0 0 0 3px #c7d2fe}
.btn{height:44px;border:2px solid var(--ink);border-radius:8px;background:var(--main);font-weight:700;font-size:15px}
.btn:hover{background:var(--main-h)}
.btn:disabled{opacity:.6;cursor:progress}
.gbtn{height:40px;border:2px solid var(--ink);border-radius:8px;background:#fff;font-weight:600;font-size:14px}
.gbtn:hover{background:var(--sub)}
.lbox.guest .fu{display:none}
.lerr{min-height:20px;font-size:13.5px;font-weight:600;color:var(--red)}

/* ---------- верхняя панель ---------- */
.bar{position:sticky;top:0;z-index:15;background:#fff;border-bottom:2px solid var(--ink)}
.bar-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.brand{font-family:var(--f);font-weight:700;font-size:17px;white-space:nowrap;margin-right:6px}
.tabs{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{height:38px;padding:0 14px;border:2px solid transparent;border-radius:8px;background:none;font-weight:600;font-size:14.5px;white-space:nowrap;color:var(--muted)}
.tab:hover{color:var(--ink);background:var(--soft)}
.tab[aria-selected="true"]{border-color:var(--ink);background:var(--main);color:var(--ink)}
.tools{display:flex;align-items:center;gap:8px;flex:none}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--muted);max-width:420px;line-height:1.25}
.sync i{width:9px;height:9px;border-radius:50%;background:#9ca3af;flex:none}
.sync.ok i{background:#16a34a}.sync.busy i{background:#d97706}.sync.bad{color:var(--red)}.sync.bad i{background:var(--red)}
.tb{height:36px;border:2px solid var(--ink);border-radius:8px;background:#fff;padding:0 10px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tb:hover{background:var(--sub)}
.tb b{font-variant-numeric:tabular-nums}
body.ro #chg,body.ro .pen{display:none!important}

/* ---------- шапка карты ---------- */
.top{max-width:1240px;margin:0 auto;padding:26px 20px 0;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start}
.box{border:2px solid var(--ink);border-radius:8px;padding:12px 16px;background:#fff;font-family:var(--f);font-size:14px}
.legend{display:flex;flex-direction:column;gap:7px}
.legend div{display:flex;align-items:center;gap:10px}
.legend i{width:30px;height:16px;border:2px solid var(--ink);border-radius:4px;flex:none}
.legend i.m{background:var(--main)}.legend i.s{background:var(--sub)}.legend i.x{background:var(--soft)}.legend i.w{background:#fff}
.legend i.k{width:22px;height:22px;border:0;border-radius:11px;background:var(--ink);color:#fff;font:700 12px/22px var(--fb);font-style:normal;text-align:center;margin:0 4px}
.legend span{line-height:1.3}
.who{display:flex;flex-direction:column;gap:8px;max-width:360px}
.who .r{display:block;color:var(--muted);font-size:13px}
.who .nm{display:block;font-weight:700;font-size:15px}
.who .ps{display:block;color:var(--muted);font-size:13px}
.tot{display:grid;grid-template-columns:repeat(2,auto);gap:4px 14px;margin-top:4px}
.tot b{font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.tot span{color:var(--muted);align-self:center}
.intro{max-width:1240px;margin:16px auto 0;padding:0 20px;font-size:15px;color:var(--muted)}
.intro p{max-width:80ch}

/* ---------- карта ---------- */
.map{position:relative;max-width:1240px;margin:0 auto;padding:10px 20px 90px}
svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.title{position:relative;text-align:center;font-family:var(--f);font-size:32px;font-weight:700;padding:56px 0 34px;line-height:1.2}
.title span{display:inline-block}
.row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 260px minmax(0,1fr);column-gap:70px;align-items:center;padding:26px 0}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.col.l{align-items:flex-end}.col.r{align-items:flex-start}
.n{position:relative;font-family:var(--f);font-size:15px;line-height:1.3;text-align:center;border:2px solid var(--ink);border-radius:6px;padding:9px 14px;background:var(--sub);width:min(100%,340px);transition:background-color .15s}
.n:hover{background:var(--sub-h)}
.n.main{background:var(--main);font-size:17px;font-weight:700;padding:12px 16px;width:100%;z-index:1}
.n.main:hover{background:var(--main-h)}
.n .c{position:absolute;right:-9px;top:-9px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--ink);color:#fff;font:700 12px/22px var(--fb);text-align:center}
.n.on{outline:3px solid var(--focus);outline-offset:2px}
.n .tm{display:block;font:600 12px/1.3 var(--fb);color:var(--muted);margin-bottom:2px}
.n.life{background:var(--soft)}.n.life:hover{background:var(--soft-h)}
.steps{display:flex;flex-direction:column;gap:8px;padding-left:28px;width:min(100%,340px)}
.n.st{background:#fff;text-align:left;padding:7px 12px 7px 40px;font-size:14px;width:100%}
.n.st:hover{background:var(--sub)}
.n.st b{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:23px;height:23px;border-radius:50%;background:var(--main);border:2px solid var(--ink);font:700 12px/19px var(--fb);text-align:center}
.n.ex{background:var(--soft)}.n.ex:hover{background:var(--soft-h)}

/* ---------- панель справа ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.pn{position:fixed;top:0;right:0;bottom:0;width:min(580px,100vw);background:#fff;border-left:2px solid var(--ink);z-index:21;transform:translateX(102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;visibility:hidden}
body.open .pn{transform:none;visibility:visible}body.open .scrim{opacity:1;pointer-events:auto}
.ph{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--hair)}
.ph .crumb{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:38px;height:38px;border:2px solid var(--ink);border-radius:8px;background:#fff;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--sub)}
.pb{flex:1;overflow:auto;padding:22px 26px 40px}
.pb h2{font-family:var(--f);font-size:30px;font-weight:700;line-height:1.15;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 20px}
.tag{font-size:13px;font-weight:600;border:1.5px solid var(--ink);border-radius:99px;padding:2px 10px;background:#fff}
.tag.y{background:var(--sub)}
.pb h3{font-size:13px;font-weight:700;color:var(--muted);margin:22px 0 10px}
.lead{font-size:17px;line-height:1.6}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.list>li{display:flex;gap:10px;font-size:16px;line-height:1.5}
.list>li>.ic{color:var(--ok);margin-top:3px}
.list>li>div{min-width:0;flex:1}
.list .t{display:block;font-weight:600}
.list .t.r{font-weight:400}
.list .d{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.sub{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;color:#374151;font-size:15px}
.sub li{position:relative;padding-left:16px}
.sub li::before{content:'';position:absolute;left:3px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:14px;border:1.5px solid var(--ink);border-radius:6px;padding:2px 9px;background:var(--sub)}
.chip.w{background:#fff}
.note{display:block;margin-top:20px;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:12px 14px;font-size:15px;font-weight:600}
.alert{display:flex;gap:8px;align-items:flex-start;margin-top:14px;color:var(--red);background:var(--red-bg);border-radius:8px;padding:10px 12px;font-size:15px;font-weight:600}
.alert .ic{margin-top:3px}
.links{display:flex;flex-direction:column;gap:8px}
.go{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--ink);border-radius:8px;background:var(--sub);padding:10px 12px;font-family:var(--f);font-size:15px}
.go:hover{background:var(--sub-h)}
.go>b{margin-left:auto;font:700 12px/20px var(--fb);background:var(--ink);color:#fff;border-radius:10px;padding:0 7px}
.go.w{background:#fff}.go.w:hover{background:var(--sub)}
.go.g{background:var(--soft)}.go.g:hover{background:var(--soft-h)}
.go .num{width:23px;height:23px;border-radius:50%;background:var(--main);border:2px solid var(--ink);font:700 12px/19px var(--fb);text-align:center;flex:none}
.go .tm{font:600 13px var(--fb);color:var(--muted);min-width:92px;font-variant-numeric:tabular-nums}
.go.m{background:var(--main)}.go.m:hover{background:var(--main-h)}
.pf{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--hair)}
.pf button{flex:1;height:42px;border:2px solid var(--ink);border-radius:8px;background:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.pf button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf button:hover:not(:disabled){background:var(--sub)}
.pf button:disabled{opacity:.35;cursor:default}

/* ---------- редактирование ---------- */
.pen{position:absolute;z-index:40;width:30px;height:30px;border-radius:8px;border:2px solid var(--ink);background:var(--main);display:none;place-items:center;padding:0}
.pen.on{display:grid}
.pen .ic{width:15px;height:15px}
[data-ek].editing{outline:2px dashed var(--focus);outline-offset:3px;border-radius:4px;background:#eef2ff;cursor:text}
dialog.edl{width:min(720px,calc(100vw - 32px));max-height:min(80vh,760px);border:2px solid var(--ink);border-radius:12px;padding:0}
dialog.edl::backdrop{background:rgba(0,0,0,.35)}
.edh{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--hair);position:sticky;top:0;background:#fff}
.edh h2{font-family:var(--f);font-size:22px;flex:1}
.edb{padding:4px 20px 20px;display:flex;flex-direction:column}
.er{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 14px;padding:14px 0;border-bottom:1px solid var(--hair)}
.er:last-child{border-bottom:0}
.er .w{font-size:12.5px;color:var(--muted2)}
.er .o{font-size:14px;color:var(--muted);text-decoration:line-through}
.er .nv{font-size:15px;font-weight:600}
.er .nv.e{font-weight:500;color:var(--red)}
.er button{grid-column:2;grid-row:1/span 3;align-self:center;height:34px;border:2px solid var(--ink);background:#fff;border-radius:8px;padding:0 12px;font-weight:600;font-size:13px}
.er button:hover{background:var(--sub)}
.edb .none{padding:22px 0;color:var(--muted)}

.del{flex:none;width:28px;height:28px;margin-left:4px;border:1.5px solid transparent;border-radius:7px;background:none;color:var(--muted2);display:grid;place-items:center;opacity:0;transition:opacity .15s}
.list>li:hover .del,.del:focus-visible{opacity:1}
.del:hover{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.del .ic{width:15px;height:15px}
.add{margin-top:12px;height:38px;padding:0 14px;border:2px dashed var(--ink);border-radius:8px;background:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.add:hover{background:var(--sub)}
.btools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:26px;padding-top:16px;border-top:1px solid var(--hair);font-size:14px}
.btools label{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--muted)}
.btools select{height:38px;border:2px solid var(--ink);border-radius:8px;background:#fff;padding:0 8px;font:inherit;color:var(--ink);max-width:260px}
.btools .rm{height:38px;padding:0 12px;border:2px solid var(--red);color:var(--red);border-radius:8px;background:#fff;font-weight:600;margin-left:auto}
.btools .rm:hover,.btools .rm.sure{background:var(--red);color:#fff}
.n.addn{background:#fff;border-style:dashed;color:var(--muted);font-family:var(--fb);font-weight:600;font-size:14px;padding:7px 12px}
.n.addn:hover{background:var(--sub);color:var(--ink)}
body.ro .del,body.ro .add,body.ro .btools,body.ro .addn{display:none!important}
.er .nv.add-t{color:var(--ok)}
.er button:disabled{opacity:.4;cursor:default;background:#fff}
@media (max-width:900px){
  .row{grid-template-columns:1fr;row-gap:10px;padding:18px 0}
  .n.main{width:min(100%,360px);order:-1}.col.l{order:1}.col.r{order:2}
  .col.l,.col.r{align-items:stretch;padding-left:34px}
  .n{width:100%}.steps{width:100%}
  .title{text-align:left;font-size:26px;padding:28px 0 20px}
  .pb{padding:18px 18px 32px}.pb h2{font-size:25px}
}
@media (max-width:640px){
  .bar-in{padding:8px 12px;gap:8px}.brand{display:none}.tabs{order:2;flex:1 0 100%}.tools{flex:1;justify-content:flex-end;flex-wrap:wrap;min-width:0}.sync{margin-right:auto}
  .top,.intro,.map{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.bar,.pn,.scrim,.pen{display:none!important}}
</style>
</head>
<body>
<div class="login" id="login">
  <form class="lbox" id="lform" autocomplete="on">
    <h1>Объём работы лидерской программы</h1>
    <p>Данные зашифрованы. Войдите тем же логином и паролем, что и в календаре стратсессии, или по гостевому паролю.</p>
    <label class="fld fu">Логин<input id="lu" name="username" autocomplete="username" required></label>
    <label class="fld">Пароль<input id="lp" name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn" id="lbtn" type="submit">Войти</button>
    <button class="gbtn" id="gbtn" type="button">Гостевой вход — только просмотр</button>
    <div class="lerr" id="lerr" role="alert"></div>
  </form>
</div>

<div class="hidden" id="app">
  <header class="bar"><div class="bar-in">
    <span class="brand">«100 Лидеров»</span>
    <nav class="tabs" role="tablist" aria-label="Разделы" id="tabs"></nav>
    <div class="tools"><span class="sync" id="sync" role="status"><i></i><span>Загрузка…</span></span>
      <button class="tb" id="chg" type="button"></button>
      <button class="tb" id="logout" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>Выйти</button></div>
  </div></header>
  <div class="top" id="top"></div>
  <div class="intro" id="intro"></div>
  <div class="map" id="map"><svg class="wires" id="wires" aria-hidden="true"></svg>
    <h1 class="title" id="ttl"></h1>
    <div id="rows"></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="pn" id="pn" role="dialog" aria-modal="true" aria-labelledby="pt" aria-hidden="true">
  <div class="ph"><span class="crumb" id="crumb"></span><button class="ib" id="px" type="button" aria-label="Закрыть"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="pb" id="pb"></div>
  <div class="pf"><button id="pprev" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg><span>Назад</span></button><button id="pnext" type="button"><span>Дальше</span><svg class="ic" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></div>
</aside>
<button class="pen" id="pen" type="button" title="Редактировать" aria-label="Редактировать"><svg class="ic" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
<dialog class="edl" id="edl" aria-labelledby="edlt"><div class="edh"><h2 id="edlt">Правки</h2><button class="ib" id="edlx" type="button" aria-label="Закрыть"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><div class="edb" id="edb"></div></dialog>

<script>
'use strict';
/* ---------- утилиты ---------- */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c};
const I={check:'<path d="M20 6 9 17l-5-5"/>',alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
 loop:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',hist:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
 arrow:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const mk=S=>({g(k){try{return S().getItem(k)}catch(e){return null}},s(k,v){try{S().setItem(k,v)}catch(e){}},d(k){try{S().removeItem(k)}catch(e){}}});
const ls=mk(()=>localStorage),ss=mk(()=>sessionStorage);

/* ---------- шифрование (ключ и пользователи — как в календаре стратсессии) ---------- */
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=b=>{const u=new Uint8Array(b);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const aesDec=async(k,iv,ct)=>new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(iv)},k,ub64(ct)));
const aesEnc=async(k,bytes)=>{const iv=crypto.getRandomValues(new Uint8Array(12));return {iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,bytes))}};
let KEY=null,SKEY=null,USER='',RAW=null,TAB='all',SYNC=null,RO=true,DOC=null,PEND=[];
const encJSON=o=>aesEnc(KEY,enc.encode(JSON.stringify(o)));
const decJSON=async o=>JSON.parse(dec.decode(await aesDec(KEY,o.iv,o.ct)));
const getJSON=async f=>{const r=await fetch(f+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Нет файла '+f);return r.json()};

async function login(u,p){
  const data=await getJSON('data.enc.json');u=u.trim().toLowerCase();
  const id=await sha('strat:'+u),e=data.users.find(x=>x.u===id);
  const bad=u==='guest'?'Неверный гостевой пароль':'Неверный логин или пароль';
  if(!e)throw new Error(bad);
  const base=await crypto.subtle.importKey('raw',enc.encode(u+':'+p),'PBKDF2',false,['deriveKey']);
  const kek=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:ub64(e.salt),iterations:e.it||data.iter},base,{name:'AES-GCM',length:256},false,['decrypt']);
  let raw,sraw=null;try{raw=await aesDec(kek,e.iv,e.wk);if(e.swk)sraw=await aesDec(kek,e.siv,e.swk)}catch(_){throw new Error(bad)}
  ss.s('vol.k',b64(raw));ss.s('vol.u',u);if(sraw)ss.s('vol.s',b64(sraw));else ss.d('vol.s');
  await openApp(raw,u,data,sraw);
}
async function openApp(raw,u,data,sraw){
  KEY=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);USER=u;
  RO=!sraw;SKEY=sraw?await crypto.subtle.importKey('raw',sraw,'AES-GCM',false,['decrypt']):null;
  document.body.classList.toggle('ro',RO);
  data=data||await getJSON('data.enc.json');RAW=await decJSON(data);
  DOC={depts:structuredClone(RAW.depts),log:[]};PEND=[];
  const loc=await readLocal();if(loc&&loc.doc){DOC=loc.doc;PEND=loc.pend||[]}
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  const t=ss.g('vol.tab');TAB=t&&(t==='all'||DOC.depts[t])?t:'all';
  render();syncPull();
}
let GUEST=false;
$('#gbtn').onclick=()=>{GUEST=!GUEST;$('#lform').classList.toggle('guest',GUEST);$('#lu').required=!GUEST;$('#gbtn').textContent=GUEST?'Войти по логину':'Гостевой вход — только просмотр';$('#lerr').textContent='';(GUEST?$('#lp'):$('#lu')).focus()};

/* ---------- документ и операции правки: путь = место в данных отдела (P.0.b.1.t и т. п.) ---------- */
const DEP=['op','oo','otis'],ABBR={op:'ОП',oo:'ОО',otis:'ОТиС'};
const getP=(o,p)=>p.split('.').reduce((x,k)=>x==null?x:x[k],o);
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
let DD={};const rebuild=()=>{DD=DOC.depts};
/* редактируемый текст: E(вкладка, путь, тег, класс) */
const E=(t,p,tag='span',cls='')=>{const v=getP(DD[t],p);if(typeof v!=='string')return '';return v.trim()?`<${tag}${cls?` class="${cls}"`:''} data-et="${t}" data-ek="${esc(p)}" data-o="${esc(v)}">${esc(v)}</${tag}>`:''};
function applyOp(doc,op){const D=doc.depts[op.t];if(!D)return false;
  if(op.k==='set'){const ks=op.p.split('.'),l=ks.pop(),o=getP(D,ks.join('.'));if(o==null||typeof o[l]!=='string')return false;o[l]=op.v;return true}
  if(op.k==='ins'){const a=getP(D,op.p);if(!Array.isArray(a))return false;op.i=Math.min(op.i,a.length);a.splice(op.i,0,structuredClone(op.val));return true}
  if(op.k==='del'){const a=getP(D,op.p);if(!Array.isArray(a)||!same(a[op.i],op.val))return false;a.splice(op.i,1);return true}
  if(op.k==='mv'){const a=getP(D,op.from),b=getP(D,op.to);if(!Array.isArray(a)||!Array.isArray(b)||a===b||!same(a[op.fi],op.val))return false;a.splice(op.fi,1);op.ti=Math.min(op.ti,b.length);b.splice(op.ti,0,structuredClone(op.val));return true}
  return false}
const inverse=op=>op.k==='set'?{k:'set',t:op.t,p:op.p,o:op.v,v:op.o}:op.k==='ins'?{k:'del',t:op.t,p:op.p,i:op.i,val:op.val}:op.k==='del'?{k:'ins',t:op.t,p:op.p,i:op.i,val:op.val}:{k:'mv',t:op.t,from:op.to,fi:op.ti,to:op.from,ti:op.fi,val:op.val};
function doOp(op,after){op.a=USER;op.ts=Date.now();op.id=op.ts.toString(36)+Math.random().toString(36).slice(2,7);
  if(!applyOp(DOC,op))return false;DOC.log.push(op);PEND.push(op);refresh();if(after)after();if($('#edl').open)drawLog();persist();return true}

/* ---------- подсчёт объёма ---------- */
const cItem=it=>typeof it==='string'?1:it.sub?it.sub.length:1;
const cBlock=(D,b)=>b.flow?(D.FLOW||[]).length:Math.max(1,b.items.reduce((s,i)=>s+cItem(i),0));
const cRow=r=>1+r[3].length;
const cDay=d=>d.day.reduce((s,r)=>s+cRow(r),0);
const cPhase=(D,p)=>p.days?p.days.reduce((s,d)=>s+cDay(d),0):p.b.reduce((s,b)=>s+cBlock(D,b),0);
const nRowsOf=p=>p.days?p.days.reduce((s,d)=>s+d.day.length,0):0;
const nMtoOf=p=>p.days?p.days.reduce((s,d)=>s+d.day.reduce((x,r)=>x+r[4].length,0),0):0;
const total=D=>D.P.reduce((s,p)=>s+cPhase(D,p),0);
const nDir=D=>D.P.reduce((s,p)=>s+(p.b?p.b.length:0),0);
const unit=(p,n)=>p.days?plural(n,'задача','задачи','задач'):plural(n,'действие','действия','действий');

/* ---------- узлы карты отдела ---------- */
function nodesOf(t){const D=DD[t],N=[];
  D.P.forEach((p,i)=>{N.push({k:'p',i});
    if(p.days)p.days.forEach((d,j)=>{N.push({k:'y',i,j});d.day.forEach((r,q)=>N.push({k:'r',i,j,q}))});
    else p.b.forEach((b,j)=>{N.push({k:'b',i,j});if(b.flow){(D.FLOW||[]).forEach((s,x)=>N.push({k:'s',i,j,x}));N.push({k:'x',i,j})}})});
  return N}
const idOf=n=>n.k==='p'?`p${n.i}`:n.k==='b'?`b${n.i}-${n.j}`:n.k==='y'?`y${n.i}-${n.j}`:n.k==='r'?`r${n.i}-${n.j}-${n.q}`:n.k==='s'?`s${n.x}`:n.k==='x'?'x':n.k==='d'?`d-${n.t}`:`g-${n.t}-${n.i}`;
let NODES=[];

function renderDept(t){
  const D=DD[t];document.title='Карта работы · '+ABBR[t];

    else{const fl=p.b.map((b,j)=>j).filter(j=>p.b[j].flow),rest=p.b.map((b,j)=>j).filter(j=>!p.b[j].flow);if(fl.length){R=fl;L=rest}else rest.forEach((j,k)=>(k%2?R:L).push(j))}
    const node=j=>{
      if(p.days){const d=p.days[j];return d.t.trim()?`<button class="n" type="button" data-id="y${i}-${j}">${esc(d.t)}</button>`:''}

/* провода: сплошная ось между главными узлами, пунктир к остальным */
function wires(){
  const svg=$('#wires');if(!$('.n.main')){svg.innerHTML='';return}
  const M=$('#map').getBoundingClientRect(),r=e=>{const b=e.getBoundingClientRect();return {l:b.left-M.left,r:b.right-M.left,t:b.top-M.top,b:b.bottom-M.top,cx:(b.left+b.right)/2-M.left,cy:(b.top+b.bottom)/2-M.top}};
  const solid=[],dot=[],mains=$$('.n.main').map(r),T=r($('#ttl')),wide=innerWidth>900;
  if(wide)dot.push(`M${mains[0].cx} 0V${T.t+12}`);
  solid.push(`M${mains[0].cx} ${T.b-8}V${mains[0].t}`);
  for(let k=0;k<mains.length-1;k++){const a=mains[k],b=mains[k+1];solid.push(`M${a.cx} ${a.b}V${b.t}`)}
  $$('#rows .row').forEach((row,k)=>{const m=mains[k];
    row.querySelectorAll('.col>.n:not(.addn)').forEach(n=>{const s=r(n);
      if(s.l>=m.r-1){const dx=(s.l-m.r)/2;dot.push(`M${m.r} ${m.cy}C${m.r+dx} ${m.cy} ${s.l-dx} ${s.cy} ${s.l} ${s.cy}`)}
      else if(s.r<=m.l+1){const dx=(m.l-s.r)/2;dot.push(`M${m.l} ${m.cy}C${m.l-dx} ${m.cy} ${s.r+dx} ${s.cy} ${s.r} ${s.cy}`)}
      else{const x=m.l+16;dot.push(`M${x} ${m.b}V${s.cy}H${s.l}`)}});
    row.querySelectorAll('.steps').forEach(st=>{const h=r(st.previousElementSibling),x=h.l+14;st.querySelectorAll('.n').forEach(n=>{const s=r(n);dot.push(`M${x} ${h.b}V${s.cy}H${s.l}`)})})});
  svg.innerHTML=`<path d="${solid.join('')}" fill="none" stroke="var(--line)" stroke-width="3"/><path d="${dot.join('')}" fill="none" stroke="var(--line)" stroke-width="2.5" stroke-dasharray="1 6" stroke-linecap="round"/>`;
}

      <h3>Расписание дня</h3><div class="links">${d.day.map((r,q)=>rowBtn(n.i,n.j,q,r)).join('')}</div>`}}
  if(n.k==='b'){const p=D.P[n.i],b=p.b[n.j],c=cBlock(D,b),bp=`P.${n.i}.b.${n.j}`;
    const head=`<h2 id="pt">${E(t,bp+'.t')}</h2><div class="meta"><span class="tag y">${esc(p.t)}</span><span class="tag">${c} ${b.flow?plural(c,'стадия','стадии','стадий'):plural(c,'действие','действия','действий')}</span></div>`;
    if(b.flow)return {crumb:p.t,html:head+`<h3>Путь лида по стадиям</h3><div class="links">${D.FLOW.map((s,x)=>go(`s${x}`,`<span class="num">${x+1}</span>${esc(s.t)}`,null,'w')).join('')}${go('x','Отказ, самоотказ и другие выходы',null,'g')}</div>`};
    const others=D.P.map((q,i2)=>q.b&&i2!==n.i?`<option value="${i2}">${esc(q.t)}</option>`:'').join('');
    const tools=`<div class="btools"><label>Перенести в этап <select id="mvsel"><option value="">— выберите —</option>${others}</select></label><button class="rm" id="delb" type="button">Удалить блок</button></div>`;
    return {crumb:p.t,html:head+items(t,bp+'.items',b.items,true)
      +(b.contacts?`<h3>Контакты подразделений</h3><ul class="list">${b.contacts.map((x,k)=>`<li>${ic('check')}<div>${E(t,`${bp}.contacts.${k}.0`,'span','t')}${x[1]?E(t,`${bp}.contacts.${k}.1`,'span','d'):''}</div></li>`).join('')}</ul>`:'')
      +(b.note!=null?E(t,bp+'.note','span','note'):'')+tools}}
  if(n.k==='r'){const d=D.P[n.i].days[n.j],r=d.day[n.q],rp=`P.${n.i}.days.${n.j}.day.${n.q}`;
    return {crumb:`${d.t} · пункт ${n.q+1} из ${d.day.length}`,html:`<h2 id="pt">${E(t,rp+'.1')}</h2><div class="meta"><span class="tag y">${E(t,rp+'.0')}</span>${r[2]?`<span class="tag">${E(t,rp+'.2')}</span>`:''}</div>
      <h3>Задачи</h3>${items(t,rp+'.3',r[3],true)}
      ${r[4].length?`<h3>МТО</h3><div class="chips">${r[4].map((x,k)=>E(t,`${rp}.4.${k}`,'span','chip w')).join('')}</div>`:''}
      ${r[5]?E(t,rp+'.5','span','note'):''}`}}
  if(n.k==='s'){const s=D.FLOW[n.x],sp=`FLOW.${n.x}`;
    return {crumb:`Обработка лида · стадия ${n.x+1} из ${D.FLOW.length}`,html:`<h2 id="pt">${E(t,sp+'.t')}</h2><div class="meta">${s.w?`<span class="tag y">${E(t,sp+'.w')}</span>`:''}</div>
      <p class="lead">${E(t,sp+'.d')}</p>${s.note!=null?E(t,sp+'.note','span','note'):''}
      ${s.bx?`<h3>Статусы в карточке</h3><div class="chips">${s.bx.map((x,k)=>E(t,`${sp}.bx.${k}`,'span','chip')).join('')}</div>`:''}
      ${(s.ex||[]).map((e,k)=>`<div class="alert">${ic('alert')}${E(t,`${sp}.ex.${k}`)}</div>`).join('')}
      ${s.loop?`<div class="alert">${ic('loop')}${E(t,sp+'.loop')}</div>`:''}`}}
  return {crumb:'Обработка лида',html:`<h2 id="pt">Отказ и самоотказ возможны с любой стадии</h2><div style="height:16px"></div>
    <ul class="list">${D.EXITS.map((x,k)=>`<li>${ic('alert')}<div>${E(t,`EXITS.${k}.0`,'span','t')}${E(t,`EXITS.${k}.1`,'span','d')}</div></li>`).join('')}</ul>
    <h3>Также с любой стадии</h3><div class="chips">${D.ALWAYS.map((x,k)=>E(t,`ALWAYS.${k}`,'span','chip')).join('')}</div>`};
}
const nameOf=n=>{if(!n)return '';const D=n.t?DD[n.t]:DD[TAB];
  return n.k==='d'?D.dept:n.k==='g'?D.P[n.i].t:n.k==='p'?D.P[n.i].t:n.k==='b'?D.P[n.i].b[n.j].t:n.k==='y'?D.P[n.i].days[n.j].t:n.k==='r'?D.P[n.i].days[n.j].day[n.q][1]:n.k==='s'?D.FLOW[n.x].t:'Выходы'};
let cur=-1,curId=null,lastFocus=null;
function openNode(id,keep){
  const k=NODES.findIndex(n=>idOf(n)===id);if(k<0)return;cur=k;curId=id;const {crumb,html}=body(NODES[k]);
  const st=keep?$('#pb').scrollTop:0;$('#crumb').textContent=crumb;$('#pb').innerHTML=html;$('#pb').scrollTop=st;
  $$('.n.on').forEach(e=>e.classList.remove('on'));const el=$(`#rows .n[data-id="${id}"]`);if(el)el.classList.add('on');
  $('#pprev').disabled=k===0;$('#pnext').disabled=k===NODES.length-1;
  $('#pprev span').textContent=k>0?nameOf(NODES[k-1]):'Назад';$('#pnext span').textContent=k<NODES.length-1?nameOf(NODES[k+1]):'Дальше';
  $$('#pb [data-go]').forEach(b=>b.onclick=()=>openNode(b.dataset.go));
  $$('#pb [data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab,b.dataset.open));
  if(!RO&&TAB!=='all'){const t=TAB;
    $$('#pb [data-add]').forEach(b=>b.onclick=()=>{const base=b.dataset.add,a=getP(DD[t],base),i=a.length;doOp({k:'ins',t,p:base,i,val:'Новый пункт'},()=>{const el=$(`#pb [data-ek="${CSS.escape(base+'.'+i)}"]`);if(el)startEdit(el)})});
    $$('#pb [data-del]').forEach(b=>b.onclick=()=>{const base=b.dataset.del,i=+b.dataset.i;doOp({k:'del',t,p:base,i,val:structuredClone(getP(DD[t],base)[i])})});
    $$('#pb [data-addb]').forEach(b=>b.onclick=()=>addBlock(+b.dataset.addb));
    const n=NODES[k];
    if(n.k==='b'){const mv=$('#mvsel'),db=$('#delb'),from=`P.${n.i}.b`;
      if(mv)mv.onchange=()=>{if(mv.value==='')return;const i2=+mv.value,to=`P.${i2}.b`,ti=getP(DD[t],to).length;doOp({k:'mv',t,from,fi:n.j,to,ti,val:structuredClone(DD[t].P[n.i].b[n.j])},()=>openNode(`b${i2}-${ti}`))};
      if(db)db.onclick=()=>{if(!db.classList.contains('sure')){db.classList.add('sure');db.textContent='Точно удалить? Нажмите ещё раз';return}
        const pid=`p${n.i}`;doOp({k:'del',t,p:from,i:n.j,val:structuredClone(DD[t].P[n.i].b[n.j])},()=>openNode(pid))}}}
  if(!document.body.classList.contains('open')){lastFocus=document.activeElement;document.body.classList.add('open');$('#pn').setAttribute('aria-hidden','false')}
  if(!keep){$('#px').focus({preventScroll:true});
    if(el){const b=el.getBoundingClientRect();if(b.top<70||b.bottom>innerHeight-20)el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}}
}
function closePanel(silent){document.body.classList.remove('open');$('#pn').setAttribute('aria-hidden','true');$$('.n.on').forEach(e=>e.classList.remove('on'));curId=null;pen.classList.remove('on');if(!silent&&lastFocus)lastFocus.focus({preventScroll:true})}
$('#rows').addEventListener('click',e=>{const a=e.target.closest('[data-addb]');if(a){addBlock(+a.dataset.addb);return}const n=e.target.closest('.n');if(n&&n.dataset.id)openNode(n.dataset.id)});
function addBlock(i){if(RO)return;const t=TAB,p=`P.${i}.b`,j=getP(DD[t],p).length;
  doOp({k:'ins',t,p,i:j,val:{t:'Новый блок',items:[]}},()=>{openNode(`b${i}-${j}`);const el=$('#pt span');if(el)startEdit(el)})}
$('#px').onclick=()=>closePanel();$('#scrim').onclick=()=>closePanel();
$('#pprev').onclick=()=>cur>0&&openNode(idOf(NODES[cur-1]));$('#pnext').onclick=()=>cur<NODES.length-1&&openNode(idOf(NODES[cur+1]));
document.addEventListener('keydown',e=>{if(editing||!document.body.classList.contains('open')||$('#edl').open)return;
  if(e.key==='Escape')closePanel();else if(e.key==='ArrowRight')$('#pnext').click();else if(e.key==='ArrowLeft')$('#pprev').click()});

/* ---------- редактирование по карандашу ---------- */
const pen=$('#pen');let target=null,editing=null,hideT=0;
function placePen(el){const r=document.createRange();r.selectNodeContents(el);const rs=r.getClientRects();const last=rs.length?rs[rs.length-1]:el.getBoundingClientRect();
  let x=last.right+6,y=last.top+last.height/2-15;if(x+32>innerWidth)x=innerWidth-34;pen.style.left=(x+scrollX)+'px';pen.style.top=(y+scrollY)+'px';pen.classList.add('on');target=el}
document.addEventListener('pointerover',e=>{if(editing||!KEY||RO)return;const el=e.target.closest&&e.target.closest('[data-ek]');
  if(el){clearTimeout(hideT);placePen(el)}else if(!e.target.closest('#pen')){clearTimeout(hideT);hideT=setTimeout(()=>{pen.classList.remove('on');target=null},350)}});
$('#pb').addEventListener('scroll',()=>{if(!editing)pen.classList.remove('on')});
pen.addEventListener('pointerover',()=>clearTimeout(hideT));
pen.addEventListener('click',()=>{if(target&&!RO)startEdit(target)});
function startEdit(el){
  editing=el;pen.classList.remove('on');const before=el.textContent;
  try{el.contentEditable='plaintext-only'}catch(e){}if(el.contentEditable!=='plaintext-only')el.contentEditable='true';
  el.classList.add('editing');el.focus();const sel=getSelection(),r=document.createRange();r.selectNodeContents(el);sel.removeAllRanges();sel.addRange(r);
  const done=save=>{el.removeEventListener('keydown',kd);el.removeEventListener('blur',bl);el.contentEditable='false';el.classList.remove('editing');editing=null;
    const v=el.textContent.replace(/\s+/g,' ').trim();if(!save||v===before.trim()){el.textContent=before;return}
    setEdit(el.dataset.et,el.dataset.ek,v,el.dataset.o)};
  const kd=e=>{e.stopPropagation();if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();el.blur()}else if(e.key==='Escape'){e.preventDefault();done(false)}};
  const bl=()=>done(true);el.addEventListener('keydown',kd);el.addEventListener('blur',bl);
}
function setEdit(t,k,v,o){
  const ks=k.split('.'),l=ks.pop(),par=getP(DD[t],ks.join('.'));
  if(v===''&&Array.isArray(par)&&/^(P\.\d+\.b\.\d+\.items|P\.\d+\.days\.\d+\.day\.\d+\.3)$/.test(ks.join('.')))return doOp({k:'del',t,p:ks.join('.'),i:+l,val:par[+l]});
  doOp({k:'set',t,p:k,o,v});
}
function refresh(){const id=curId,open=document.body.classList.contains('open');render();if(open&&id)openNode(id,true)}

/* ---------- журнал правок ---------- */
const canRevert=op=>{if(op.hist||op.rev||DOC.log.some(x=>x.rev===op.id))return false;if(op.k==='set')return getP(DOC.depts[op.t],op.p)===op.v;return applyOp(structuredClone(DOC),inverse(op))};
const label=v=>typeof v==='string'?v:v&&v.t!=null?v.t:'';
function paintChg(){$('#chg').innerHTML=`${ic('hist')}Правки <b>${DOC?DOC.log.length:0}</b>`}
function drawLog(){
  const L=DOC.log.slice(-300).reverse();
  $('#edb').innerHTML=L.length?L.map(op=>{const w=`${ABBR[op.t]} · ${esc(op.a||'')} · ${new Date(op.ts).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'})}${op.rev?' · возврат':''}`;
    const body=op.k==='set'?`<span class="o">${esc(op.o||'')}</span><span class="nv${op.v?'':' e'}">${op.v?esc(op.v):'Скрыто (текст удалён)'}</span>`
      :op.k==='ins'?`<span class="nv add-t">Добавлено: ${esc(label(op.val))}</span>`:op.k==='del'?`<span class="nv e">Удалено: ${esc(label(op.val))}</span>`
      :`<span class="nv">Перенесён блок «${esc(label(op.val))}» в этап «${esc(getP(DD[op.t],op.to.replace(/\.b$/,'.t'))||'')}»</span>`;
    const ok=canRevert(op);return `<div class="er"><span class="w">${w}</span>${body}<button type="button" data-id="${op.id||''}" ${ok?'':'disabled title="Эту правку нельзя вернуть автоматически"'}>Вернуть</button></div>`}).join('')
    :'<p class="none">Правок пока нет. Откройте любой блок на карте, наведите на текст в панели справа и нажмите на карандаш.</p>';
  $$('#edb [data-id]').forEach(b=>b.onclick=()=>{const op=DOC.log.find(x=>x.id===b.dataset.id);if(op&&canRevert(op)){const inv=inverse(op);inv.rev=op.id;doOp(inv)}});
}
$('#chg').onclick=()=>{drawLog();$('#edl').showModal()};
$('#edlx').onclick=()=>$('#edl').close();
$('#edl').addEventListener('click',e=>{if(e.target===$('#edl'))$('#edl').close()});

/* ---------- хранение: браузер + зашифрованный файл в репозитории ---------- */
async function readLocal(){const s=ls.g('vol.d');if(!s)return null;try{return await decJSON(JSON.parse(s))}catch(e){return null}}
const saveLocal=async()=>ls.s('vol.d',JSON.stringify(await encJSON({doc:DOC,pend:PEND})));
function syncSt(t,c){const e=$('#sync');e.className='sync '+(c||'');e.querySelector('span').textContent=t}
// запасной путь к GitHub API через Cloudflare Worker на своём домене (xolchade.dev/gh/…).
// Переключаемся на него, только если прямой запрос не дошёл и прокси действительно ответил от GitHub.
(()=>{const F=window.fetch.bind(window),D='https://api.github.com/',P=location.origin+'/gh/',can=!/github\.io$/.test(location.hostname)&&location.protocol==='https:';
  const fromGH=r=>!!r.headers.get('x-github-request-id')||/json/.test(r.headers.get('content-type')||'');
  let via=ss.g('vol.ghvia')==='1';
  const viaProxy=async(u,o)=>{const r=await F(P+u.slice(D.length),o);if(!fromGH(r))throw new TypeError('proxy');return r};
  window.fetch=async(u,o)=>{
    if(typeof u!=='string'||!u.startsWith(D))return F(u,o);
    if(via&&can){try{return await viaProxy(u,o)}catch(e){via=false;ss.d('vol.ghvia')}}
    const put=o&&o.method&&o.method!=='GET',c=new AbortController(),t=setTimeout(()=>c.abort(),put?45000:10000);
    try{const r=await F(u,{...(o||{}),signal:c.signal});clearTimeout(t);return r}
    catch(e){clearTimeout(t);if(!can)throw e;const r=await viaProxy(u,o);via=true;ss.s('vol.ghvia','1');return r}
  };
})();
const api=()=>`https://api.github.com/repos/${SYNC.repo}/contents/${SYNC.path.replace(/[^/]+$/,'doc.enc.json')}`;
const hdr=()=>({Authorization:'Bearer '+SYNC.token,Accept:'application/vnd.github+json'});
async function ghGet(){
  const r=await fetch(api()+'?t='+Date.now(),{headers:hdr(),cache:'no-store'});
  if(r.status===404&&r.headers.get('x-github-request-id'))return {sha:null,data:null};
  if(!r.ok)throw new Error(r.status===401?'токен GitHub недействителен или истёк':'GitHub '+r.status);
  const j=await r.json();return {sha:j.sha,data:await decJSON(JSON.parse(dec.decode(ub64(j.content.replace(/\n/g,'')))))};
}
const fresh=()=>({depts:structuredClone(RAW.depts),log:[]});
function rebase(server){const base=server||fresh();if(!base.log)base.log=[];const ids=new Set(base.log.map(x=>x.id));
  for(const op of PEND)if(!ids.has(op.id)&&applyOp(base,op))base.log.push(op);if(base.log.length>1500)base.log=base.log.slice(-1500);return base}
async function syncPull(){
  if(RO){try{const d=await decJSON(await getJSON('doc.enc.json'));if(!same(d,DOC)){DOC=d;refresh()}}catch(e){}syncSt('Только просмотр','');return}
  if(!SYNC){try{const o=await getJSON('sync.enc.json');SYNC=JSON.parse(dec.decode(await aesDec(SKEY,o.iv,o.ct)))}catch(e){SYNC=null}}
  if(!SYNC){syncSt('Только в этом браузере','bad');return}
  try{syncSt('Синхронизация…','busy');const {data}=await ghGet();const next=rebase(data),changed=!same(next,DOC);DOC=next;await saveLocal();
    if(PEND.length||!data)await syncPush();else syncSt('Сохранено на сервере','ok');
    if(changed&&!editing)refresh()}
  catch(e){syncSt('Сервер недоступен: '+(e.name==='TypeError'?'нет связи с GitHub':e.message),'bad')}
}
let pushing=null;
async function persist(){if(RO)return;await saveLocal();if(!SYNC){syncSt('Только в этом браузере','bad');return}pushing=(pushing||Promise.resolve()).then(syncPush);await pushing}
async function syncPush(){
  for(let i=0;i<3;i++){
    try{
      syncSt('Сохраняю…','busy');
      const {sha,data}=await ghGet();const next=rebase(data),sent=PEND.length;
      const body={message:'volume: правки',content:b64(enc.encode(JSON.stringify(await encJSON(next))))};if(sha)body.sha=sha;
      const r=await fetch(api(),{method:'PUT',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(r.status===409||r.status===422){await new Promise(z=>setTimeout(z,600*(i+1)));continue}
      if(!r.ok)throw new Error(r.status===401?'токен GitHub недействителен или истёк':'GitHub '+r.status);
      PEND=PEND.slice(sent);DOC=PEND.length?rebase(next):next;await saveLocal();clearTimeout(retryT);retryN=0;syncSt('Сохранено на сервере','ok');if(!editing)refresh();return;
    }catch(e){
      const why=e.name==='TypeError'?'нет связи с GitHub':e.message;
      if(retryN<5){retryN++;clearTimeout(retryT);retryT=setTimeout(()=>persist(),15000*retryN);syncSt(`Не сохранено: ${why}. Повторю автоматически`,'bad')}
      else syncSt(`Не сохранено: ${why}. Правки остались в этом браузере`,'bad');
      $('#sync').title='Правки хранятся в этом браузере и уйдут на сервер при следующей удачной попытке';return}
  }
  clearTimeout(retryT);retryT=setTimeout(()=>persist(),5000);syncSt('Конфликт при сохранении, повторяю…','busy');
}
let retryT=0,retryN=0;
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&KEY&&!editing)syncPull()});
</script>
